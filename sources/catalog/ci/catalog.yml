# .github/workflows/catalog.yml
#
# The gate the v1.19.0 fork got past. Three failures made that possible and each
# has a step here:
#   1. the staging XSD's techniqueType was <xs:any/>, so "schema valid" meant
#      almost nothing  -> validate against prompt_technique_catalog_1.3.0.xsd;
#   2. nothing checked cross-record invariants (references, duplicates, counts,
#      vocabularies)    -> validate_catalog.py --strict;
#   3. nothing compared the six exports to each other, so the XML drifted 47
#      records ahead    -> compare_exports.py.
#
# Order matters. The source of truth is checked before anything is generated
# from it, so a bad merge fails before it can be rendered into five formats.

name: catalog

on:
  pull_request:
    paths:
      - "data/prompt_technique_catalog.json"
      - "scripts/build_catalog.py"
      - "techniques/**"
      - "PROMPT_TECHNIQUE_CATALOG.md"
  push:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # 1. The source of truth, before anything is generated from it.
      - name: Validate the source of truth
        run: |
          python tools/promptnexus-hygiene/validate_catalog.py \
            data/prompt_technique_catalog.json --strict --format github

      # 2. Regenerate every rendering. The builder is the only writer; nothing
      #    downstream is edited by hand, which is what this step enforces by
      #    overwriting all of it.
      - name: Build all exports
        run: python scripts/build_catalog.py

      # 3. Structural validation of the XML export, against a schema that
      #    actually constrains a <technique>.
      - name: Validate the XML export against the 1.3.0 schema
        run: |
          xmllint --noout \
            --schema tools/promptnexus-hygiene/prompt_technique_catalog_1.3.0.xsd \
            data/prompt_technique_catalog.xml

      - name: Validate the XML export
        run: |
          python tools/promptnexus-hygiene/validate_catalog.py \
            data/prompt_technique_catalog.xml --strict --format github

      # 4. Every export must describe the same catalog. This is the check whose
      #    absence let the XML run 47 records ahead of everything else.
      - name: Compare exports
        run: |
          python tools/promptnexus-hygiene/compare_exports.py \
            data/prompt_technique_catalog.xml \
            --per-technique-dir techniques \
            --markdown PROMPT_TECHNIQUE_CATALOG.md

      # 5. Nothing generated may differ from what is committed. A green build on
      #    a dirty tree means someone edited a rendering by hand.
      - name: Fail if any export is out of date
        run: |
          if ! git diff --quiet --exit-code; then
            echo "::error::Generated exports differ from the committed ones."
            echo "Run scripts/build_catalog.py and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
