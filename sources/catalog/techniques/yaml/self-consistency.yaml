id: self-consistency
name: Self-Consistency
category: reasoning-elicitation
subcategory: multi-path-reasoning
executive_summary: Sample several independent reasoning paths for the same question, then take the most
  common final answer instead of trusting any single chain.
description: Replaces greedy single-path decoding with temperature sampling of multiple diverse CoT reasoning
  paths, then marginalizes over them by majority vote on the final answer. Because wrong reasoning paths
  tend to disagree with each other while correct ones tend to converge, voting recovers accuracy that
  any individual sampled chain would miss. It is the standard baseline any more elaborate multi-call reasoning
  technique should be measured against.
verification_status: verifier-checkable
cost_profile: multi-call-fixed
when_to_use:
- The task has a clear extractable final answer that can be compared for exact or near-exact match across
  samples.
- You can afford k>=5 sampled completions per question.
when_not_to_use:
- Open-ended generation with no well-defined 'same answer' equivalence class to vote over.
- Latency-critical single-call settings.
known_pitfalls:
- Cost scales linearly with sample count k; diminishing returns typically appear well before k=40.
related_techniques:
- chain-of-thought
- tree-of-thoughts
- skeleton-of-thought
primary_source:
  authors: Wang, Wei, Schuurmans, Le, Chi, Narang, Chowdhery, Zhou
  year: 2023
  title: Self-Consistency Improves Chain of Thought Reasoning in Language Models
  venue: ICLR 2023
  arxiv_id: '2203.11171'
  url: https://arxiv.org/abs/2203.11171
usage_templates:
- template_name: Sample-and-vote harness
  template: |-
    # Repeat N={{num_samples}} times at temperature={{temperature}}:
    {{cot_prompt}}

    # Then:
    Extract the final answer from each of the {{num_samples}} completions and return the most frequent one. On ties, prefer the answer from the completion with the shortest reasoning chain.
  variables:
  - name: num_samples
    description: How many independent chains to sample
    example: '10'
  - name: temperature
    description: Sampling temperature (nonzero, for diversity)
    example: '0.7'
  - name: cot_prompt
    description: The underlying CoT or Zero-Shot-CoT prompt to sample from
    example: null
  template_id: self-consistency--sample-and-vote-harness
  determinism: stochastic-by-design
  reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
    vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
    on intermediate stochastic choices).
tags:
- reasoning
- multi-call
- voting
- baseline
status: corpus-present
aliases:
- CoT-SC
secondary_sources: []
corpus_file: Self-Consistency.pdf
