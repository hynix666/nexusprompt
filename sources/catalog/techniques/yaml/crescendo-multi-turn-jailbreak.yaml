id: crescendo-multi-turn-jailbreak
name: Crescendo (Multi-Turn Escalation Jailbreak)
category: prompt-injection-defense
subcategory: threat-modeling
executive_summary: Start with a benign question, then escalate gradually across turns by referencing the
  model's own prior replies — no single turn looks adversarial, but the cumulative path reaches output
  a direct request would refuse.
description: 'Unlike single-turn attacks (GCG, PAIR) or single-message context-stuffing (Many-Shot Jailbreaking),
  Crescendo exploits the model''s tendency to maintain conversational consistency across a multi-turn
  dialogue: each individual turn is a small, plausible escalation that references what the model itself
  just said, so no single message looks adversarial in isolation even though the trajectory is. An automated
  tool version (''Crescendomation'') backtracks and retries a different escalation path if the target
  refuses at some turn, similar in spirit to PAIR''s black-box refine loop but operating turn-by-turn
  within one conversation rather than across independent full-prompt attempts. Reported 56% attack success
  on GPT-4 and 83% on Gemini-Pro in the original evaluation, and the paper also demonstrates it against
  multimodal models. The most directly relevant addition for any system whose safety evaluation only tests
  single-turn prompts — Crescendo''s whole premise is that per-message review misses it.'
verification_status: unverifiable-by-text
cost_profile: agentic-loop
when_to_use:
- Red-teaming or threat-modeling any conversational (multi-turn) system, especially if existing safety
  evaluation only checks single-turn prompts in isolation.
- Evaluating whether a guardrail/classifier looks at conversational trajectory or only the latest message.
when_not_to_use:
- N/A — threat-model/red-teaming background, not an applied generation technique.
known_pitfalls:
- Defenses that classify each message independently (rather than the conversation trajectory as a whole)
  are structurally blind to this attack by construction, since no single Crescendo turn looks adversarial
  on its own.
related_techniques:
- pair-black-box-jailbreak
- many-shot-jailbreaking
- reflexion
primary_source:
  authors: Russinovich, Salem, Eldan
  year: 2024
  title: 'Great, Now Write an Article About That: The Crescendo Multi-Turn LLM Jailbreak Attack'
  venue: USENIX Security 2025
  arxiv_id: '2404.01833'
  url: https://arxiv.org/abs/2404.01833
usage_templates:
- template_name: Multi-turn escalation robustness probe (red-team use)
  template: |-
    As part of a red-team evaluation, test conversational-trajectory robustness:
    Turn 1 (fully benign opener on topic {{topic}}): {{benign_opening_question}}
    Turn 2..N (each referencing the model's own prior reply, escalating toward {{target_behavior}} one small step at a time): {{escalation_turn}}
    If the target refuses at any turn, backtrack to the last successful turn and try a different escalation angle: {{alternate_escalation}}.
    Record the turn number at which refusal first occurs (if ever), and whether a per-message classifier would have flagged that specific turn in isolation.
  variables:
  - name: topic
    description: The general subject area used as a benign entry point
    example: null
  - name: benign_opening_question
    description: The fully innocuous first turn
    example: null
  - name: target_behavior
    description: The red-team objective the escalation path is aimed at
    example: null
  - name: escalation_turn
    description: One incremental escalation step, referencing the prior reply
    example: null
  - name: alternate_escalation
    description: A different escalation angle to try after a refusal/backtrack
    example: null
  template_id: crescendo-multi-turn-jailbreak--multi-turn-escalation-robustness-probe-red-team-use
  determinism: stochastic-by-design
  reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
    vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
    on intermediate stochastic choices).
