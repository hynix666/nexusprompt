id: adaptive-rag
name: Adaptive RAG
category: retrieval-augmentation
subcategory: query-routing
executive_summary: Routes queries to different retrieval strategies based on query complexity. Simple
  queries use single-pass retrieval; complex queries use iterative or multi-source retrieval.
description: Adaptive RAG classifies incoming queries by complexity (e.g., simple factual lookup vs. multi-hop
  synthesis) and routes them to the appropriate retrieval pipeline. Simple queries go to standard vector
  retrieval; complex queries trigger iterative retrieval, decomposition, or multi-source fusion. This
  optimizes the cost-accuracy tradeoff by avoiding expensive retrieval for easy questions.
verification_status: verifier-checkable
cost_profile: multi-call-fixed
when_to_use:
- Mixed query workloads with varying complexity.
- When you want to optimize retrieval cost without sacrificing accuracy on hard questions.
- Production RAG systems serving diverse user intents.
when_not_to_use:
- When all queries are uniformly complex.
- When query complexity classification is unreliable.
- When the routing overhead exceeds retrieval savings.
known_pitfalls:
- Query complexity classification errors route hard questions to simple pipelines (under-retrieval) or
  easy questions to expensive pipelines (waste).
- Classifier training requires labeled query complexity data.
- Routing adds latency before retrieval even begins.
related_techniques:
- retrieval-augmented-generation
- corrective-rag
- self-rag
- hyde
primary_source:
  authors: Jeong, Baek, Cho, Hwang, Park
  year: 2024
  title: 'Adaptive-RAG: Learning to Adapt Retrieval-Augmented Large Language Models through Question Complexity'
  venue: arXiv
  arxiv_id: '2403.14403'
  url: https://arxiv.org/abs/2403.14403
usage_templates:
- template_name: Complexity-based query routing
  template: |-
    Query: {{query}}

    Step 1: Classify query complexity.
    Classification: {{complexity_class}}  [simple / moderate / complex]

    Step 2: Route to appropriate pipeline.
    If simple: single-pass vector retrieval.
    If moderate: single-pass + HyDE expansion.
    If complex: iterative retrieval with decomposition.

    Step 3: Generate answer from retrieved context.
  variables:
  - name: query
    description: The user query.
    example: What is the capital of France?
  - name: complexity_class
    description: The classified complexity level.
    example: simple
  template_id: adaptive-rag--complexity-routing
  determinism: deterministic-at-temperature-zero
  reproducibility_note: Complexity classification should be deterministic. Retrieval pipeline selection
    is deterministic based on classification.
tags:
- retrieval
- routing
- adaptive
- cost-optimization
