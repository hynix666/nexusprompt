id: hierarchical-chain-of-thought
name: Hierarchical Chain-of-Thought (Hi-CoT)
category: reasoning-elicitation
subcategory: hierarchical-planning
executive_summary: Alternates between high-level planning steps and low-level execution steps in a hierarchical
  structure. Reduces tokens by ~14% compared to flat CoT while maintaining accuracy.
description: 'Hi-CoT decomposes reasoning into two levels: a planner that generates high-level subgoals,
  and an executor that implements each subgoal with concrete reasoning steps. The planner and executor
  alternate, creating a hierarchical trace. This structure mirrors human problem-solving and reduces redundant
  reasoning in flat CoT.'
verification_status: verifier-checkable
cost_profile: single-call
when_to_use:
- Multi-step problems with clear hierarchical structure.
- When flat CoT produces redundant or tangential reasoning.
- Tasks where planning and execution are naturally separable.
when_not_to_use:
- Simple problems where hierarchical decomposition adds overhead.
- When the model cannot distinguish planning from execution.
- Tasks requiring continuous interleaving of planning and execution.
known_pitfalls:
- Plan quality determines execution quality; poor plans propagate errors.
- The plan/execute boundary may be ambiguous for some tasks.
- Hierarchical structure may confuse models not trained on such patterns.
related_techniques:
- chain-of-thought
- plan-and-solve-prompting
- least-to-most-prompting
- algorithm-of-thoughts
primary_source:
  authors: Huang, Li, Nikpour, Omidi
  year: 2026
  title: 'Hierarchical Chain-of-Thought: Enhancing LLM Reasoning Performance and Efficiency'
  venue: arXiv
  arxiv_id: '2604.00130'
  url: https://arxiv.org/abs/2604.00130
usage_templates:
- template_name: Plan-execute hierarchical reasoning
  template: |-
    Problem: {{problem}}

    # Planning Phase
    Generate high-level plan:
    {{high_level_plan}}

    # Execution Phase
    For each step in the plan:
      Step N: {{plan_step_n}}
      Execution: {{detailed_reasoning_for_step_n}}

    # Verification Phase
    Check that all plan steps are satisfied.
    Final Answer:
  variables:
  - name: problem
    description: The problem to solve hierarchically.
    example: Plan a 7-day trip to Japan with a budget of $2000.
  - name: high_level_plan
    description: The high-level plan generated by the model.
    example: 1. Book flights 2. Reserve hotels 3. Plan daily itinerary 4. Budget allocation
  - name: plan_step_n
    description: A specific plan step.
    example: Book flights
  - name: detailed_reasoning_for_step_n
    description: Detailed execution for the plan step.
    example: Search for flights from LAX to NRT. Compare prices on Google Flights and Skyscanner...
  template_id: hierarchical-chain-of-thought--plan-execute
  determinism: deterministic-at-temperature-zero
  reproducibility_note: Single LLM call with structured hierarchical output. Plan and execution are generated
    in one pass.
tags:
- reasoning
- hierarchical
- planning
- token-efficiency
status: verified-external
aliases:
- Hi-CoT
secondary_sources: []
corpus_file: null
schema_version: 1.3.0
source_audit:
  description: verified-against-abstract
  pitfalls: unverified
