id: truncproof-json-guardrail
name: 'TruncProof: JSON Generation Guardrail under Token-Length Constraints'
category: structured-constrained-output
subcategory: budget-aware-output
executive_summary: Keep JSON output valid and complete under a hard token budget, instead of truncating
  mid-structure when the budget runs out.
description: 'Addresses a specific failure mode of budget-constrained structured generation: naive truncation
  at a token limit can cut a JSON object off mid-key or mid-value, producing invalid output. This guardrail
  manages the generation process so that, if the budget is going to be exceeded, the output degrades gracefully
  (e.g. by omitting whole optional fields) rather than truncating into invalid syntax.'
verification_status: verifier-checkable
cost_profile: single-call
when_to_use:
- Generating JSON (or similarly structured output) under a hard, possibly tight, token budget where partial/invalid
  output is unacceptable.
when_not_to_use:
- Token budget is generously larger than any realistic output size — the guardrail adds complexity with
  no benefit.
known_pitfalls:
- Graceful degradation still means information loss (omitted fields) — downstream consumers must handle
  partial-but-valid JSON.
related_techniques:
- structured-output-json-mode
primary_source:
  authors: (local corpus)
  year: 2026
  title: 'TruncProof: A Guardrail for LLM-based JSON Generation under Token-Length Constraints'
  venue: arXiv preprint
  arxiv_id: '2605.13076'
  url: null
usage_templates:
- template_name: Budget-aware structured generation
  template: |-
    Generate JSON conforming to: {{json_schema}}
    Hard token budget: {{token_budget}}
    If the full structure would exceed the budget, omit optional fields in this priority order (lowest priority first): {{optional_field_priority}}. Never emit syntactically invalid JSON, even under budget pressure.
  variables:
  - name: json_schema
    description: The target schema
    example: null
  - name: token_budget
    description: Hard output token ceiling
    example: '512'
  - name: optional_field_priority
    description: Which optional fields to drop first if the budget is tight
    example: null
  template_id: truncproof-json-guardrail--budget-aware-structured-generation
  determinism: deterministic-at-temperature-zero
  reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
    running this template again at temperature 0 against the same model version should reproduce the same
    output.
tags:
- structured-output
- json
- token-budget
- reliability
