id: jailbroken-competing-objectives-framework
name: 'Jailbroken: Competing Objectives and Mismatched Generalization'
category: prompt-injection-defense
subcategory: threat-modeling
executive_summary: A diagnostic framework explaining WHY jailbreaks succeed — not an attack itself, but
  two named failure modes (competing training objectives, safety training that doesn't generalize) most
  attacks in this catalog exploit.
description: 'Distinct in kind from the other threat-modeling entries in this catalog: rather than proposing
  a new attack technique, this paper diagnoses the structural reasons safety-trained models remain jailbreakable
  at all, identifying two failure modes. Competing objectives: pretraining/instruction-following and safety
  objectives can be placed in tension (e.g. an instruction that''s simultaneously followed faithfully
  and violates a safety constraint), and a sufficiently capable model may resolve that tension toward
  compliance. Mismatched generalization: safety training doesn''t cover every input distribution capability
  training does (e.g. safety training in English but capability extending to low-resource languages or
  unusual encodings), leaving gaps an attacker can target directly. Uses these two principles to guide
  design of new attacks that succeed against then-state-of-the-art models on their own curated harmful-behavior
  benchmark, evaluated against both automated and human red-teaming judgments.'
verification_status: unverifiable-by-text
cost_profile: single-call
when_to_use:
- Threat-modeling or explaining to a stakeholder *why* a class of jailbreak worked, not just cataloging
  that it did — useful as a shared vocabulary ('this is a mismatched-generalization gap' vs. 'this is
  a competing-objectives exploit') for organizing red-team findings from other techniques in this catalog.
- Designing new red-team test cases by deliberately targeting one of the two named failure modes rather
  than searching unguided.
when_not_to_use:
- N/A — this is a diagnostic framework and threat-model background, not an applied generation technique
  with its own usage template in the usual sense; the template below is illustrative of applying the framework,
  not a literal attack recipe.
known_pitfalls:
- The two failure modes are a useful organizing lens, not an exhaustive taxonomy — a jailbreak that doesn't
  cleanly fit either category isn't necessarily out of scope, just not explained by this specific framework.
related_techniques:
