id: instance-adaptive-zero-shot-cot
name: Instance-Adaptive Zero-Shot Chain-of-Thought
category: reasoning-elicitation
subcategory: single-path-reasoning
executive_summary: Adapt the zero-shot CoT trigger phrase per input instance rather than using one fixed
  trigger for every question — effective CoT depends on information flowing from the specific question
  into the prompt.
description: 'Motivated by an interpretability finding: a single fixed zero-shot trigger phrase (''Let''s
  think step by step'') is not equally effective across all instances, because effective zero-shot CoT
  reasoning depends on information flowing from the specific question into both the prompt and the generated
  rationale. Rather than accept a uniform trigger, this method adaptively differentiates good and bad
  prompt variants per instance, selecting or adapting the trigger based on the question''s own content
  — a zero-cost-exemplar alternative to Active Prompting''s human-annotated approach.'
verification_status: verifier-checkable
cost_profile: multi-call-adaptive
when_to_use:
- Zero-shot CoT deployments across a heterogeneous instance distribution, where a single fixed trigger
  phrase is suspected to underperform on some question types.
when_not_to_use:
- A homogeneous task distribution where the standard fixed trigger already performs consistently well
  — the added adaptation overhead isn't justified.
known_pitfalls:
- Requires some mechanism (the information-flow-based selection procedure from the paper, or a proxy for
  it) to actually differentiate good from bad prompts per instance; without that, this degrades to guessing.
related_techniques:
- zero-shot-cot
- active-prompting
primary_source:
  authors: Yuan, Shen, Yan, Zhang, Xie, Wang, Guan, Wang, Ye
  year: 2024
  title: Instance-adaptive Zero-shot Chain-of-Thought Prompting
  venue: NeurIPS 2024
  arxiv_id: '2409.20441'
  url: https://arxiv.org/abs/2409.20441
usage_templates:
- template_name: Per-instance adaptive trigger selection
  template: |-
    Question: {{question}}
    Candidate zero-shot triggers: {{trigger_candidates}}
    Using information-flow signal from the question to each candidate trigger, select or adapt the trigger most likely to draw relevant semantic content from this specific question: {{selected_trigger}}

    {{question}}
    {{selected_trigger}}
  variables:
  - name: question
    description: The specific question instance
    example: null
  - name: trigger_candidates
    description: Set of candidate zero-shot trigger phrases to select/adapt from
    example: null
  - name: selected_trigger
    description: The trigger chosen or adapted for this instance
    example: null
  template_id: instance-adaptive-zero-shot-cot--per-instance-adaptive-trigger-selection
  determinism: stochastic-by-design
  reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
    vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
    on intermediate stochastic choices).
