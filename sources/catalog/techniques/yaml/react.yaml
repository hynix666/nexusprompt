id: react
name: ReAct (Reason + Act)
category: agentic-tool-use
subcategory: reasoning-action-interleaving
executive_summary: Interleave reasoning traces ('thoughts') with actions against an external environment
  or tool, so each action is informed by explicit reasoning and each new observation updates the reasoning.
description: At each step the model produces a Thought (reasoning about what to do next), an Action (a
  tool call — search, lookup, calculator, etc.), and receives an Observation (the tool's result), which
  becomes context for the next Thought. This grounds reasoning in real intermediate feedback rather than
  the model's own unchecked assumptions, and is the paper most later agent-loop frameworks cite as their
  origin.
verification_status: verifier-checkable
cost_profile: agentic-loop
when_to_use:
- The task requires interacting with an external tool or environment (search, code execution, APIs) whose
  results should inform subsequent reasoning.
when_not_to_use:
- No external tools are available or needed — plain CoT is simpler and cheaper for closed-book reasoning.
known_pitfalls:
- Can loop unproductively (repeated similar actions) without an explicit step or turn limit.
related_techniques:
- program-of-thoughts
- reflexion
- plan-and-solve-prompting
primary_source:
  authors: Yao, Zhao, Yu, Du, Shafran, Narasimhan, Cao
  year: 2023
  title: 'ReAct: Synergizing Reasoning and Acting in Language Models'
  venue: ICLR 2023
  arxiv_id: '2210.03629'
  url: https://arxiv.org/abs/2210.03629
usage_templates:
- template_name: Thought-Action-Observation loop
  template: |-
    Answer the question using the available tools: {{tool_list}}
    Question: {{question}}

    Thought: {{reasoning_about_next_step}}
    Action: {{tool_name}}[{{tool_input}}]
    Observation: {{tool_result}}
    ... (repeat Thought/Action/Observation until ready) ...
    Thought: I now know the final answer.
    Final Answer: {{final_answer}}
  variables:
  - name: tool_list
    description: Names and descriptions of available tools
    example: null
  - name: question
    description: The task/question to resolve
    example: null
  - name: tool_name
    description: Which tool is being invoked this step
    example: search
  - name: tool_input
    description: Input passed to the tool
    example: null
  - name: tool_result
    description: What the tool returned
    example: null
  - name: reasoning_about_next_step
    description: The model's stated reasoning for what to do next
    example: null
  - name: final_answer
    description: The final answer once enough Thought/Action/Observation steps have run
    example: null
  template_id: react--thought-action-observation-loop
  determinism: requires-external-system
  reproducibility_note: This template depends on an external system (retrieval index, tool, solver, or
    interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility requires
    that system's state to also be fixed.
tags:
- agentic
- tool-use
- multi-call
status: verified-external
aliases: []
secondary_sources: []
corpus_file: null
schema_version: 1.3.0
source_audit:
