id: multiagent-debate
name: Multiagent Debate
category: agentic-tool-use
subcategory: multi-model-consensus
executive_summary: Have multiple model instances propose answers and critique each other's reasoning over
  several rounds, converging on a shared answer that outperforms any single instance.
description: Several independent instances of a model (or different models) each answer a question, then
  see each other's answers and reasoning and are prompted to critique, defend, or revise their own position.
  After a fixed number of rounds, answers are aggregated (typically majority vote). Improves factual accuracy
  and reasoning relative to a single model's self-consistency sampling, at a higher cost.
verification_status: verifier-checkable
cost_profile: multi-call-adaptive
when_to_use:
- Factuality- or reasoning-critical tasks where the cost of several rounds of multiple model calls is
  acceptable.
when_not_to_use:
- Latency- or cost-constrained settings — this is one of the more expensive techniques in the catalog.
known_pitfalls:
- Debating instances can converge on a shared wrong answer if the models share the same underlying weaknesses
  (correlated errors).
related_techniques:
- self-consistency
- reflexion
primary_source:
  authors: Du, Li, Torralba, Tenenbaum, Mordatch
  year: 2024
  title: Improving Factuality and Reasoning in Language Models through Multiagent Debate
  venue: ICML 2024
  arxiv_id: '2305.14325'
  url: https://arxiv.org/abs/2305.14325
usage_templates:
- template_name: N-agent, R-round debate
  template: |-
    # Round 1 (independent, per agent)
    {{question}}

    # Round r>1 (per agent, given all other agents' prior-round answers)
    These are the solutions to the problem from other agents:
    {{other_agents_previous_answers}}

    Using the reasoning from other agents as additional advice, can you give an updated answer to: {{question}}

    # Final
    After {{num_rounds}} rounds, take the majority answer across all {{num_agents}} agents' final-round responses.
  variables:
  - name: question
    description: The question all agents are answering
    example: null
  - name: other_agents_previous_answers
    description: Concatenated answers/reasoning from all other agents in the previous round
    example: null
  - name: num_rounds
    description: Number of debate rounds
    example: '3'
  - name: num_agents
    description: Number of independent agent instances
    example: '3'
  template_id: multiagent-debate--n-agent-r-round-debate
  determinism: stochastic-by-design
  reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
    vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
    on intermediate stochastic choices).
tags:
- agentic
- multi-model
- consensus
- multi-call
status: verified-external
aliases: []
secondary_sources: []
