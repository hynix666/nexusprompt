- id: frugalgpt
  name: FrugalGPT
  category: agentic-tool-use
  subcategory: cost-optimization
  executive_summary: Cascades queries from cheaper, smaller models to more expensive, larger models, only
    escalating if the smaller model's output is uncertain or low-quality. Reduces cost while maintaining
    accuracy.
  description: FrugalGPT addresses the high inference cost of using large LLMs for all queries. A tier-1
    cheap model generates an answer and a confidence score. A router evaluates the confidence; if it falls
    below a threshold, the query escalates to a tier-2 expensive model.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - High-volume inference pipelines where cost is a binding constraint.
  - Environments with access to multiple models of varying sizes and costs.
  - Tasks where simpler queries can be handled by smaller models without quality loss.
  when_not_to_use:
  - Latency-critical applications where sequential cascading adds unacceptable delay.
  - When only a single model is available.
  - Tasks where all queries are equally complex and require the largest model.
  known_pitfalls:
  - Requires a reliable confidence/scoring mechanism; a bad scorer wastes money or degrades quality.
  - Training the router requires labeled data and adds upfront cost.
  - Cascading adds latency; parallel execution of all tiers is wasteful.
  related_techniques:
  - self-calibration
  primary_source:
    authors: Chen, Zaharia, Zou
    year: 2023
    title: 'FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance'
    venue: arXiv
    arxiv_id: '2305.05176'
    url: https://arxiv.org/abs/2305.05176
  usage_templates:
  - template_name: Two-tier model cascade
    template: |-
      # Tier 1 (Cheap Model)
      Query: {{query}}
      Generate an answer and a confidence score (0.0-1.0).
      Answer: {{tier_1_answer}}
      Confidence: {{tier_1_confidence}}

      # Router Logic
      If {{tier_1_confidence}} < {{threshold}}:
          # Tier 2 (Expensive Model)
          Query: {{query}}
          Answer: {{tier_2_answer}}
      Else:
          Return {{tier_1_answer}}
    variables:
    - name: query
      description: The user input.
      example: Explain quantum entanglement in simple terms.
    - name: tier_1_answer
      description: Answer from the small/cheap model.
      example: Quantum entanglement is when two particles become connected...
    - name: tier_1_confidence
      description: Model's self-reported or router-predicted confidence.
      example: '0.4'
    - name: threshold
      description: Confidence cutoff for escalation.
      example: '0.8'
    - name: tier_2_answer
      description: Answer from the large/expensive model.
      example: Quantum entanglement is a physical phenomenon that occurs when a pair or group of particles...
    template_id: frugalgpt--two-tier-cascade
    determinism: deterministic-at-temperature-zero
    reproducibility_note: Router and confidence scorer should be deterministic. Tier models may be non-deterministic
      depending on temperature setting.
  tags:
  - cost
  - optimization
  - cascade
  - routing
  status: verified-external
  aliases:
  - Model Cascade
  - LLM Cascade
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: buffer-of-thoughts
  name: Buffer of Thoughts (BoT)
  category: reasoning-elicitation
  subcategory: meta-reasoning
  executive_summary: Replaces brute-force search over reasoning trees with a Meta-Buffer—a dynamic library
    of high-level problem-solving templates. A Problem Distiller extracts core structure, retrieves matching
    templates, and instantiates them for the target task. Reduces token and API costs by ~88% compared
    to multi-query search.
  description: 'BoT consists of three components: (1) a Problem Distiller that strips task filler to extract
    core variables and constraints, (2) a Meta-Buffer containing thought templates, and (3) a Buffer Manager
    that condenses novel verified traces into new templates. At inference time, the distiller analyzes
    the query, retrieves the most relevant thought template, instantiates it with task-specific values,
    and executes the structured reasoning.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Complex reasoning tasks where Tree of Thoughts or similar search methods are too expensive.
  - Domains with recurring problem structures that can be templatized.
  - Cost-sensitive applications requiring strong reasoning performance.
  when_not_to_use:
  - Novel problem types with no matching templates in the Meta-Buffer.
  - When the overhead of template retrieval exceeds the savings.
  - Tasks requiring exploration of many diverse solution paths.
  known_pitfalls:
  - Meta-Buffer coverage limits applicability.
  - Template instantiation quality depends on the distiller's extraction accuracy.
  - Buffer maintenance requires ongoing curation.
  related_techniques:
  - tree-of-thoughts
  - graph-of-thoughts
  - least-to-most-prompting
  - plan-and-solve-prompting
  primary_source:
    authors: Yang, Yu, Zhang, Cao, Xu, Zhang, Gonzalez, Cui
    year: 2024
    title: 'Buffer of Thoughts: Thought-Augmented Reasoning with Large Language Models'
    venue: NeurIPS 2024 (Spotlight)
    arxiv_id: '2406.04271'
    url: https://arxiv.org/abs/2406.04271
  usage_templates:
  - template_name: Meta-buffer reasoning with problem distillation
    template: |-
      # Phase 1: Problem Distillation
      Task Input: {{task_input}}
      Extract and summarize:
      1. Primary Goal:
      2. Known Variables & Values:
      3. Explicit Constraints & Implicit Boundaries:

      # Phase 2: Thought-Template Retrieval & Instantiation
      Meta-Buffer Thought-Template: {{retrieved_thought_template}}
      Instantiate the template above by assigning task variables to template slots:
      {{instantiated_reasoning_structure}}

      # Phase 3: Execution
      Follow the instantiated structure step-by-step to arrive at the final answer.
      Final Answer:
    variables:
    - name: task_input
      description: The problem or task to solve.
      example: A farmer has 17 sheep and all but 9 die. How many are left?
    - name: retrieved_thought_template
      description: The matching high-level reasoning template from the Meta-Buffer.
      example: 1. Identify trick phrases ("all but X"). 2. Compute complement. 3. Verify against literal
        interpretation.
    - name: instantiated_reasoning_structure
      description: The template with task-specific values filled in.
      example: '1. The phrase "all but 9 die" means 9 survive. 2. Total sheep = 17; dead = 8; alive =
        9. 3. Literal check: 17 - 8 = 9. Confirmed.'
    template_id: buffer-of-thoughts--meta-buffer-reasoning
    determinism: deterministic-at-temperature-zero
    reproducibility_note: Template retrieval and instantiation are deterministic if the Meta-Buffer is
      fixed. Non-determinism may arise from template generation if the buffer is dynamically updated.
  tags:
  - meta-reasoning
  - template
  - cost-reduction
  - memory
  status: verified-external
  aliases:
  - BoT
  - Thought-Augmented Reasoning
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: cache-optimized-context-engineering
  name: Cache-Optimized Context Engineering
  category: template-pattern-scaffolding
  subcategory: infrastructure-aware-prompting
  executive_summary: Structural layout optimized for API-level prefix caching (e.g., Anthropic Prompt
    Caching, OpenAI Prompt Caching). Places static content first to maximize cache hits, reducing latency
    and token cost substantially, per the providers' own published figures.
  description: 'Modern LLM APIs offer prefix caching: if the initial portion of a prompt (the prefix)
    is identical across requests, the provider caches the KV activations and only charges for the new
    suffix tokens. Cache-Optimized Context Engineering explicitly structures prompts with a long static
    prefix followed by a short dynamic suffix.'
  verification_status: unverifiable-by-text
  cost_profile: single-call
  when_to_use:
  - High-volume APIs where the same system instructions and tool schemas are reused across thousands of
    requests.
  - When using providers that support prefix caching.
  - RAG systems where retrieved documents vary but the retrieval prompt structure is fixed.
  when_not_to_use:
  - Providers that do not support prefix caching.
  - Applications where every prompt is unique with no reusable prefix.
  - When the static prefix is shorter than the provider's minimum cache window.
  known_pitfalls:
  - Cache hit rate depends on exact byte-level prefix matching.
  - Provider cache TTL may be short; monitor cache hit metrics.
  - Over-optimizing for cache may hurt readability or maintainability.
  related_techniques:
  - llmlingua-prompt-compression
  - retrieval-augmented-generation
  primary_source:
    authors: Anthropic / OpenAI Documentation
    year: 2025
    title: 'Prompt Engineering Best Practices: Prefix Caching'
    venue: Practitioner Guide
    arxiv_id: null
    url: https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching
  usage_templates:
  - template_name: Static-prefix cached layout
    template: |-
      <!-- STATIC PREFIX (Prefix-Cached across requests) -->
      [SYSTEM INSTRUCTIONS / PERSONA]
      {{system_instructions}}

      [TOOL SCHEMAS / API DEFINITIONS]
      {{tool_schemas}}

      [FEW-SHOT EXEMPLAR BLOCK]
      {{few_shot_exemplars}}

      <!-- DYNAMIC SUFFIX (Appended per request) -->
      [RETRIEVED CONTEXT / DOCUMENT PASSAGES]
      {{retrieved_context}}

      [USER QUERY]
      {{user_query}}
    variables:
    - name: system_instructions
      description: Static system prompt reused across all requests.
      example: You are a helpful medical assistant. Be concise and evidence-based.
    - name: tool_schemas
      description: Static tool/API definitions reused across requests.
      example: 'Available tools: search_web(query), calculate(expression)'
    - name: few_shot_exemplars
      description: Static few-shot examples reused across requests.
      example: 'Q: What is hypertension? A: Hypertension is high blood pressure...'
    - name: retrieved_context
      description: Dynamic retrieved documents unique to each request.
      example: 'Document 1: Recent study on ACE inhibitors...'
    - name: user_query
      description: The unique user query.
      example: What are the side effects of lisinopril?
    template_id: cache-optimized-context-engineering--static-prefix-layout
    determinism: deterministic-at-temperature-zero
    reproducibility_note: The static prefix must be byte-identical across requests to trigger cache hits.
      Any change (whitespace, ordering, content) invalidates the cache.
  tags:
  - infrastructure
  - cost-reduction
  - caching
  - production
  status: practitioner-guide
  aliases:
  - Prefix Caching
  - Static-Dynamic Prompt Layout
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
