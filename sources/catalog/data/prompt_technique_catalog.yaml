- id: auto-cot
  name: Auto-CoT (Automatic Chain-of-Thought)
  category: reasoning-elicitation
  subcategory: example-curation
  executive_summary: Automatically construct a diverse set of few-shot CoT exemplars by clustering unlabeled
    questions and generating reasoning chains for one representative per cluster — no manual exemplar
    writing at all.
  description: Clusters a pool of unlabeled questions by similarity, picks one representative question
    per cluster (favoring simpler, shorter questions to reduce generated-chain error), and generates a
    Zero-Shot-CoT reasoning chain for each representative automatically. The resulting set is used directly
    as the few-shot exemplar block, removing both the manual-writing cost of hand-built CoT and the cost
    of Active Prompting's human-in-the-loop annotation step.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Building a reusable few-shot CoT exemplar set fully automatically, with no human annotation budget
    at all.
  when_not_to_use:
  - A small human-annotation budget is available — Active Prompting's uncertainty-targeted human annotation
    generally yields higher-quality exemplars.
  known_pitfalls:
  - Automatically generated chains for the cluster representatives can themselves be wrong, silently propagating
    an incorrect reasoning pattern into every prompt that reuses the exemplar set.
  related_techniques:
  - chain-of-thought
  - zero-shot-cot
  - active-prompting
  primary_source:
    authors: Zhang, Zhang, Li, Smola
    year: 2023
    title: Automatic Chain of Thought Prompting in Large Language Models
    venue: ICLR 2023
    arxiv_id: '2210.03493'
    url: https://arxiv.org/abs/2210.03493
  usage_templates:
  - template_name: Cluster-then-auto-generate exemplars
    template: |-
      # Cluster
      Cluster this pool of unlabeled questions into {{num_clusters}} groups by similarity: {{unlabeled_question_pool}}

      # Select representative + generate chain (per cluster)
      Representative question: {{cluster_representative_question}}
      Let's think step by step.
      (the resulting chain becomes one exemplar in the final few-shot block)

      # Assemble
      Concatenate all {{num_clusters}} generated exemplars into a single few-shot CoT prompt prefix for future questions.
    variables:
    - name: unlabeled_question_pool
      description: Pool of unlabeled candidate questions to cluster
      example: null
    - name: num_clusters
      description: How many clusters (= how many few-shot exemplars) to produce
      example: '8'
    - name: cluster_representative_question
      description: The chosen representative question for one cluster
      example: null
    template_id: auto-cot--cluster-then-auto-generate-exemplars
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - example-selection
  - automatic
  - zero-human-effort
  status: verified-external
  aliases:
  - Auto-CoT
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: analogical-prompting
  name: Analogical Prompting
  category: reasoning-elicitation
  subcategory: example-curation
  executive_summary: Ask the model to generate its own relevant worked examples before solving the actual
    problem, removing the need for a hand-labeled exemplar set entirely.
  description: Instead of supplying few-shot exemplars, the prompt asks the model to first recall or invent
    problems related to the target and solve those, then use that self-generated context to solve the
    real problem — an analogy to how a human might recall a similar solved problem before tackling a new
    one.
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - No hand-labeled few-shot exemplars are available and writing them is costly.
  when_not_to_use:
  - High-quality curated exemplars already exist — hand-picked or actively-selected exemplars generally
    outperform self-generated ones.
  known_pitfalls:
  - Self-generated 'similar problems' can be superficially similar but structurally misleading, propagating
    a bad analogy into a bad solution.
  related_techniques:
  - chain-of-thought
  - active-prompting
  - generated-knowledge-prompting
  primary_source:
    authors: Yasunaga, Chen, Li, Pásztor, Leskovec, Liang, Zhou
    year: 2024
    title: Large Language Models as Analogical Reasoners
    venue: ICLR 2024
    arxiv_id: '2310.01714'
    url: https://arxiv.org/abs/2310.01714
  usage_templates:
  - template_name: Self-generated analogy exemplars
    template: |-
      Problem: {{problem}}

      # Step 1: Recall
      Recall {{num_related}} distinct problems that are related to this one and briefly explain why each is related.

      # Step 2: Solve the related problems
      Solve each of the {{num_related}} related problems, showing your reasoning.

      # Step 3: Solve the target
      Using the related problems and their solutions above as guidance, now solve the original problem: {{problem}}
