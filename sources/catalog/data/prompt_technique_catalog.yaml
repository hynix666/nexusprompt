    pitfalls: unverified
- id: self-rag
  name: Self-RAG (Self-Reflective Retrieval-Augmented Generation)
  category: retrieval-augmentation
  subcategory: adaptive-retrieval
  executive_summary: Train a single model to decide for itself whether retrieval is even needed, then
    critique the relevance of what it retrieved and the quality of its own output, using special reflection
    tokens generated inline.
  description: 'Directly addresses plain RAG''s stated pitfall in this catalog — that acknowledging insufficient
    retrieval isn''t automatic and must be separately prompted for. Self-RAG bakes the decision into the
    model''s own generation policy via trained ''reflection tokens'': the model decides on-demand whether
    retrieval would help for the current segment, retrieves only when it judges retrieval necessary, generates
    while emitting tokens that assess the relevance/support of retrieved passages, and emits a token critiquing
    its own output quality. Reports outperforming ChatGPT and retrieval-augmented Llama2-chat on open-domain
    QA, reasoning, and fact verification, with notable gains in citation accuracy for long-form generation.'
  verification_status: verifier-checkable
  cost_profile: training-time
  when_to_use:
  - You control fine-tuning and want retrieval-necessity and passage-relevance judgments built into the
    model's generation policy rather than governed entirely by prompt-level instructions.
  - Long-form generation tasks where citation accuracy and avoiding over-retrieval (or under-retrieval)
    both matter.
  when_not_to_use:
  - Working with a fixed, already-trained model with no fine-tuning access — use plain retrieval-augmented-generation's
    prompt-level insufficiency guard instead.
  known_pitfalls:
  - Requires training infrastructure and reflection-token-annotated training data; the specific reflection-token
    vocabulary is fixed at training time and doesn't adapt to a genuinely novel retrieval-quality signal
    introduced later without retraining.
  related_techniques:
  - retrieval-augmented-generation
  - chain-of-verification
  primary_source:
    authors: Asai, Wu, Wang, Sil, Hajishirzi
    year: 2024
    title: 'Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection'
    venue: ICLR 2024
    arxiv_id: '2310.11511'
    url: https://arxiv.org/abs/2310.11511
  usage_templates:
  - template_name: Reflection-token-gated retrieval and generation
    template: |-
      # At each generation segment, the trained model itself emits:
      [Retrieve=Yes/No/Continue] — whether retrieval would help for this segment
      # If Retrieve=Yes:
      Retrieve passages for: {{current_segment_query}}
      [IsRel=Relevant/Irrelevant] for each retrieved passage: {{retrieved_passage}}
      Generate the segment conditioned on relevant passages only.
      [IsSup=Fully supported/Partially supported/No support] — how well the generated segment is supported by the passages used
      [IsUse=1-5] — overall usefulness self-rating of the segment

      # At inference, these tokens can be used to filter/rerank multiple sampled generations, not just to produce a single pass.
    variables:
    - name: current_segment_query
      description: Implicit query for the segment currently being generated
      example: null
    - name: retrieved_passage
      description: One passage retrieved for relevance assessment
      example: null
    template_id: self-rag--reflection-token-gated-retrieval-and-generation
    determinism: training-time-not-applicable
    reproducibility_note: This template describes a training-time process (fine-tuning or policy training),
      not a single reproducible inference call; reproducibility depends on the training pipeline and data,
      not on prompt text alone.
  tags:
  - retrieval
  - training-time
  - self-reflection
  - adaptive
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: retrieval-augmented-thoughts
  name: Retrieval-Augmented Thoughts (RAT)
  category: retrieval-augmentation
  subcategory: thought-revision
  executive_summary: Draft an initial zero-shot CoT, then revise each reasoning step one at a time using
    information retrieved specifically for that step, instead of retrieving once up front like plain RAG.
  description: 'Distinct from both plain RAG (retrieve once, then generate) and Self-RAG (train the model
    to decide when to retrieve): RAT starts with a complete initial zero-shot CoT draft — which may be
    flawed — then goes back through it step by step, retrieving fresh information relevant to the task
    query, the current step, and all prior (already-revised) steps, and revises that step accordingly.
    Targets long-horizon generation tasks (extended code generation, multi-step planning, long-form creative
    writing) where a single upfront retrieval can''t anticipate what will be needed many steps later.
    Reports substantial relative improvements applying RAT to GPT-3.5, GPT-4, and CodeLLaMA-7B: roughly
    +13.6% on code generation and +17% on mathematical reasoning tasks, with large reductions in hallucination.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Long-horizon generation tasks (extended reasoning, multi-step planning, long-form writing) where the
    information needed at step 10 isn't knowable at step 1, so a single upfront retrieval (plain RAG)
    would miss it.
  when_not_to_use:
  - Short, single-step tasks where one retrieval pass already covers everything needed — the per-step
    retrieval overhead isn't justified.
  known_pitfalls:
  - Cost scales with the number of reasoning steps needing revision, since each gets its own retrieval
    call — not a fixed, predictable cost like single-pass RAG.
  related_techniques:
  - retrieval-augmented-generation
  - self-rag
  - zero-shot-cot
  - chain-of-verification
  primary_source:
    authors: Wang, Liu, Lin, Li, Ma, Liang
    year: 2024
    title: 'RAT: Retrieval Augmented Thoughts Elicit Context-Aware Reasoning in Long-Horizon Generation'
    venue: arXiv preprint
    arxiv_id: '2403.05313'
    url: https://arxiv.org/abs/2403.05313
  usage_templates:
  - template_name: Draft-then-per-step-retrieve-and-revise
    template: |-
      # Step 0 — initial draft
      {{task_prompt}}
      Let's think step by step.
      (produces initial thoughts T1, T2, ..., Tn, possibly flawed)

      # Per-step revision (repeat for each thought Ti, in order)
      Task: {{task_prompt}}
      Revised thoughts so far: {{revised_thoughts_1_to_i_minus_1}}
      Original (unrevised) next thought: {{original_thought_i}}
      Retrieve information relevant to this specific step: {{retrieved_info_for_step_i}}
      Revise thought {{step_index}} using the retrieved information and the already-revised prior thoughts.
    variables:
    - name: task_prompt
      description: The overall long-horizon task
      example: null
    - name: revised_thoughts_1_to_i_minus_1
      description: All previously revised thought steps, in order
      example: null
    - name: original_thought_i
      description: The current step's thought from the original unrevised draft
      example: null
    - name: retrieved_info_for_step_i
      description: Information retrieved specifically for revising this step
      example: null
    - name: step_index
      description: Which step in the chain is being revised
      example: '3'
    template_id: retrieval-augmented-thoughts--draft-then-per-step-retrieve-and-revise
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - retrieval
  - reasoning
  - long-horizon
  - hallucination-reduction
  - multi-call
  status: verified-external
  aliases:
  - RAT
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: raptor-recursive-tree-retrieval
  name: RAPTOR (Recursive Abstractive Processing for Tree-Organized Retrieval)
  category: retrieval-augmentation
  subcategory: hierarchical-indexing
  executive_summary: Recursively embed, cluster, and summarize document chunks into a multi-level tree
    bottom-up, then retrieve from it — integrating information across a whole document at multiple abstraction
    levels, not just short chunks.
  description: 'Addresses a specific limitation of standard RAG: retrieving short, contiguous chunks limits
    holistic understanding of a document''s overall context, which especially hurts multi-step reasoning
    questions that need information spread across a whole document. RAPTOR builds an index-time tree by
    recursively clustering and summarizing chunks bottom-up, producing summary nodes at multiple levels
    of abstraction above the raw chunks. At query time, retrieval can pull from any level of the tree
    — a specific detail from a leaf chunk, or a high-level summary from an internal node — rather than
    being limited to one fixed granularity. Reports state-of-the-art results on multi-step reasoning QA,
    including a 20-point absolute accuracy improvement on the QuALITY benchmark when combined with GPT-4.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Long-document question answering, especially questions requiring synthesis across multiple parts of
    a document rather than a single localized fact.
  when_not_to_use:
  - Short documents or simple fact-lookup queries where flat chunk retrieval already suffices — the tree-construction
    overhead isn't justified.
  known_pitfalls:
  - Tree construction is an upfront indexing cost proportional to document length and depth; index-time
    cost trades against later query flexibility.
  related_techniques:
  - retrieval-augmented-generation
  - chain-of-density
  primary_source:
    authors: Sarthi, Abdullah, Tuli, Khanna, Goldie, Manning
    year: 2024
    title: 'RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval'
    venue: ICLR 2024
    arxiv_id: '2401.18059'
    url: https://arxiv.org/abs/2401.18059
  usage_templates:
  - template_name: Recursive cluster-summarize tree construction + multi-level retrieval
    template: |-
      # Index-time (once per document)
      Chunk the document: {{raw_chunks}}
      Cluster semantically similar chunks: {{chunk_clusters}}
      Summarize each cluster into a parent node: {{cluster_summaries}}
      Recurse: treat {{cluster_summaries}} as the new leaf level and repeat clustering/summarizing until a single root summary remains, forming a tree of depth {{tree_depth}}.

      # Query-time
      Query: {{query}}
      Retrieve the top-{{k}} most relevant nodes from ANY level of the tree (leaf chunks or summary nodes), then answer using the retrieved nodes.
    variables:
    - name: raw_chunks
      description: The document split into base-level chunks
      example: null
    - name: chunk_clusters
      description: Semantically clustered groups of chunks at one tree level
      example: null
    - name: cluster_summaries
      description: Summary node produced for each cluster
      example: null
    - name: tree_depth
      description: How many levels of recursive summarization the tree has
      example: '3'
    - name: query
      description: The user's query at retrieval time
      example: null
    - name: k
      description: How many nodes to retrieve across all tree levels
      example: '10'
    template_id: raptor-recursive-tree-retrieval--recursive-cluster-summarize-tree-construction-multi-level-retrieval
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - retrieval
  - hierarchical
  - long-document
  - multi-call
  status: verified-external
  aliases:
  - RAPTOR
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: chain-of-evidences-evidence-to-generate
  name: Chain of Evidences / Evidence to Generate (CoE / E2G)
  category: retrieval-augmentation
  subcategory: evidence-grounded-reasoning
  executive_summary: Instead of letting the model produce unverified reasoning claims, first extract only
    the thought sequences explicitly grounded in the given context as 'evidence,' then have the evidence
    itself drive output generation.
  description: 'Targets a specific weakness shared by CoT, Self-Consistency, ReAct, Reflexion, and Tree
    of Thoughts: limited grounding in the actual provided context, leading to hallucinated or inconsistent
    claims, plus iterative sluggishness in the multi-step variants. CoE/E2G is a mono/dual-step zero-shot
    framework: it first identifies and extracts only the reasoning steps that are explicitly supported
    by the given context (the ''chain of evidences''), then uses that verified evidence — rather than
    free-generated reasoning — to guide the final output. Reports state-of-the-art results on knowledge-intensive
    reasoning and generation tasks, framed as faster and more reliable than the iterative multi-call methods
    it''s compared against.'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Knowledge-intensive, context-grounded reasoning tasks (retrieval-augmented QA, document-grounded generation)
    where hallucinated intermediate claims are a specific risk to avoid.
  when_not_to_use:
  - Tasks with no given context to ground evidence extraction against — the technique specifically depends
    on there being a source context to extract evidence from.
  known_pitfalls:
  - 'Evidence-extraction quality is a single point of failure: if genuinely relevant evidence is missed
    during extraction, the final generation is grounded in an incomplete evidence set.'
  related_techniques:
  - retrieval-augmented-generation
  - chain-of-verification
  - faithful-chain-of-thought
  primary_source:
    authors: Parvez
    year: 2024
    title: 'Chain of Evidences and Evidence to Generate: Prompting for Context Grounded and Retrieval
      Augmented Reasoning'
    venue: arXiv preprint
    arxiv_id: '2401.05787'
    url: https://arxiv.org/abs/2401.05787
  usage_templates:
  - template_name: Extract-evidence-then-generate
    template: |-
      Context: {{source_context}}
      Question: {{question}}

      # Chain of Evidences (extract)
      Identify only the thought sequences explicitly present in the context above that are relevant to answering the question. Do not infer or add anything not stated in the context. Evidence chain: {{extracted_evidence_chain}}

      # Evidence to Generate
      Using only the extracted evidence chain: {{extracted_evidence_chain}}
      Generate the final answer to: {{question}}
    variables:
    - name: source_context
      description: The given grounding context
      example: null
    - name: question
      description: The question to answer
      example: null
    - name: extracted_evidence_chain
      description: The extracted, context-grounded evidence sequence
      example: null
    template_id: chain-of-evidences-evidence-to-generate--extract-evidence-then-generate
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - retrieval
  - grounding
  - hallucination-reduction
  - single-call
  status: verified-external
  aliases:
  - CoE
  - E2G
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: structured-output-json-mode
  name: Structured Output / Grammar-Constrained JSON Mode
  category: structured-constrained-output
  subcategory: decoding-time-constraints
  executive_summary: Constrain decoding to a finite-state machine built from a regex or grammar, so only
    tokens keeping the output valid are ever sampled — well-formed by construction, not by hoping the
    model complies.
  description: 'Reformulates constrained generation (JSON schemas, regexes, context-free grammars) as
    index-guided finite-state-machine traversal: the model''s vocabulary is indexed against the grammar
    so that at each step only tokens leading to a still-valid continuation are eligible, with negligible
    runtime overhead. This is the foundational technique behind most ''JSON mode'' / structured-output
    features offered by LLM providers, and the direct ancestor of the local grammar-constrained-decoding
    research cluster (structural-equivalence analysis, diffusion-model variants, rejection-sampling alternatives).'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Output must conform to a strict schema (JSON, a regex, a formal grammar) and correctness of structure
    is non-negotiable.
  when_not_to_use:
  - Free-form natural-language output where no formal grammar applies.
  known_pitfalls:
  - Guarantees structural validity, not semantic correctness — a syntactically perfect JSON object can
    still contain wrong values.
  related_techniques:
  - truncproof-json-guardrail
  - grammar-constrained-decoding-efficiency
  - chain-of-density
