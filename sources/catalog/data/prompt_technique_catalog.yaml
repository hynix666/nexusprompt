- id: longllmlingua
  name: LongLLMLingua
  category: prompt-compression-context-engineering
  subcategory: question-aware-compression
  executive_summary: Question-aware coarse-to-fine prompt compression that preserves information relevant
    to the specific query. Direct successor to LLMLingua with better retention of task-critical tokens.
  description: LongLLMLingua extends prompt compression by incorporating the question into the compression
    objective. It first performs coarse compression (removing irrelevant documents), then fine compression
    (removing irrelevant tokens within retained documents), guided by question relevance scores. This
    ensures that tokens critical to answering the specific query are preserved.
