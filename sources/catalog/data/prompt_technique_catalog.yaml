- id: flare
  name: FLARE (Forward-Looking Active REtrieval)
  category: retrieval-augmentation
  subcategory: active-retrieval
  executive_summary: Retrieves during generation when the model predicts low-confidence upcoming tokens.
    Adaptive retrieval that triggers only when needed, reducing unnecessary retrieval overhead.
  description: FLARE monitors the model's confidence during generation. If confidence drops below a threshold,
    the current sentence is used as a query to retrieve additional context, and generation continues with
    augmented information.
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Long-form generation where not all content requires external knowledge.
  - When up-front retrieval retrieves too much irrelevant context.
  - Streaming generation scenarios where retrieval can be interleaved.
  when_not_to_use:
  - Short-answer tasks where a single retrieval is sufficient.
  - When retrieval latency is too high for interleaved generation.
  - Models without confidence probability access.
  - Models without confidence probability access (black-box APIs may not expose token probs).
  known_pitfalls:
  - Threshold tuning is critical; too low misses retrieval needs, too high wastes calls.
  - Retrieval latency can stall generation pipeline.
  - May retrieve redundant information if the model oscillates around the threshold.
  related_techniques:
  - self-rag
  - retrieval-augmented-generation
  - hyde
  - corrective-rag
  primary_source:
    authors: Jiang, Xu, Gao, Sun, Liu, Dwivedi-Yu, Yang, Callan, Neubig
    year: 2023
    title: Active Retrieval Augmented Generation
    venue: arXiv
    arxiv_id: '2305.06983'
    url: https://arxiv.org/abs/2305.06983
  usage_templates:
  - template_name: Confidence-triggered active retrieval
    template: Generate next sentence. If any token probability < {{threshold}}, treat the sentence as
