- id: chain-of-abstraction
  name: Chain-of-Abstraction (CoA)
  category: agentic-tool-use
  subcategory: tool-use-training
  executive_summary: Train the model to decode a reasoning chain with abstract placeholders first, then
    call domain tools to fill each one in — decoupling general reasoning strategy from the specific tool
    results it depends on.
  description: 'Addresses a specific inefficiency in interleaved tool-use methods like ReAct: when text
    generation and API calls alternate step-by-step, the whole reasoning chain has to wait on each tool
    call before continuing, and the reasoning strategy gets entangled with tool-call-specific results.
    CoA trains the model (two-stage fine-tuning) to first produce a complete reasoning chain with abstract
    placeholders (e.g. ''y1 = Calculator(x1 + x2)'') without waiting for real values, then reifies every
    placeholder with actual tool calls afterward, which can be parallelized. This also makes the learned
    reasoning strategy more robust to shifts in the underlying domain knowledge, since the abstract chain
    doesn''t hard-code specific facts.'
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - Multi-step tool-use tasks where the reasoning structure is reusable across many different specific
    fact values (e.g. the same arithmetic strategy applied to different numbers), and you control fine-tuning.
  when_not_to_use:
  - Working with a fixed, already-trained model with no fine-tuning access — ReAct's interleaved prompting
    approach is the inference-time-only alternative.
  known_pitfalls:
  - Like Toolformer and APAR, this is a training-time technique, not a drop-in prompting pattern for an
    off-the-shelf model.
  related_techniques:
  - toolformer-self-supervised-tool-use
  - program-of-thoughts
  - react
  primary_source:
    authors: Gao, Dwivedi-Yu, Yu, Tan, Pasunuru, Golovneva, Sinha, Celikyilmaz, Bosselut, Wang
    year: 2024
    title: Efficient Tool Use with Chain-of-Abstraction Reasoning
    venue: ICML 2024
    arxiv_id: '2401.17464'
    url: https://arxiv.org/abs/2401.17464
  usage_templates:
  - template_name: Abstract-chain-then-reify training data format
    template: |-
      # Stage 1 — abstract reasoning chain (placeholders, no real tool calls yet)
      Query: {{query}}
      Abstract chain: {{placeholder_var_1}} = {{tool_name_1}}({{abstract_args_1}}); {{placeholder_var_2}} = {{tool_name_2}}({{abstract_args_2}} using {{placeholder_var_1}}); ... final answer uses {{placeholder_var_n}}

      # Stage 2 — reify (call real tools, can run in parallel where independent)
      {{placeholder_var_1}} = call {{tool_name_1}} with real arguments derived from {{query}}
      {{placeholder_var_2}} = call {{tool_name_2}} with real arguments, substituting the resolved value of {{placeholder_var_1}}
      Substitute all resolved placeholder values back into the abstract chain to produce the final answer.
    variables:
    - name: query
      description: The original multi-step query
      example: null
    - name: placeholder_var_1
      description: First abstract placeholder variable
      example: y1
    - name: tool_name_1
      description: Tool invoked for the first placeholder
      example: null
    - name: abstract_args_1
      description: Abstract (placeholder-referencing) arguments for the first tool call
      example: null
    - name: placeholder_var_2
      description: Second abstract placeholder, possibly depending on the first
      example: y2
    - name: tool_name_2
      description: Tool invoked for the second placeholder
      example: null
    - name: abstract_args_2
      description: Abstract arguments for the second tool call
      example: null
    - name: placeholder_var_n
      description: The final placeholder whose reified value is the answer
      example: null
    template_id: chain-of-abstraction--abstract-chain-then-reify-training-data-format
    determinism: training-time-not-applicable
    reproducibility_note: This template describes a training-time process (fine-tuning or policy training),
      not a single reproducible inference call; reproducibility depends on the training pipeline and data,
      not on prompt text alone.
  tags:
  - agentic
  - tool-use
  - training-time
  - efficiency
  status: verified-external
  aliases:
  - CoA
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: uncertainty-of-thoughts
  name: Uncertainty of Thoughts (UoT)
  category: agentic-tool-use
  subcategory: information-seeking
  executive_summary: Actively ask effective follow-up questions by simulating possible future scenarios,
    rewarding questions by expected information gain, and propagating that reward to pick the single best
    next question to ask.
  description: 'Targets active information-seeking specifically (medical diagnosis, troubleshooting, ''20
    Questions''-style tasks) where the information needed to solve the task isn''t given upfront and must
    be elicited through good follow-up questions — a harder problem than Self-Ask''s compositional-question
    decomposition, since here the answer isn''t already known anywhere, it has to be actively discovered.
    UoT combines three pieces: an uncertainty-aware simulation of possible future conversation branches
    and their likelihoods, an information-gain-based reward for candidate questions, and a reward-propagation
    scheme that selects the single question maximizing expected reward at each turn. Reports a 38.1% average
    improvement in successful task completion rate across the tested domains.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Tasks where the information needed to solve the problem must be actively elicited through a sequence
    of well-chosen questions, not just retrieved or reasoned from what's already given (diagnostic interviews,
    troubleshooting dialogues, guessing games).
  when_not_to_use:
  - Tasks where all necessary information is already present in the prompt — there's no information-seeking
    decision to optimize.
  known_pitfalls:
  - The simulation-based reward estimation adds real computational cost per turn compared to a simpler
    heuristic like Self-Ask's fixed decomposition.
  related_techniques:
  - self-ask
  - react
  - reflexion
  primary_source:
    authors: Hu, Liu, Feng, Zhao, Ng, Luu, He, Koh, Hooi
    year: 2024
    title: 'Uncertainty of Thoughts: Uncertainty-Aware Planning Enhances Information Seeking in Large
      Language Models'
    venue: arXiv preprint
    arxiv_id: '2402.03271'
    url: https://arxiv.org/abs/2402.03271
  usage_templates:
  - template_name: Simulate-reward-propagate question selection
    template: |-
      Task state so far: {{conversation_state}}
      Candidate follow-up questions: {{candidate_questions}}

      # Simulate
      For each candidate question, simulate {{num_simulated_branches}} possible answers and their estimated likelihoods.

      # Reward
      Estimate the expected information gain of each candidate question based on how much its simulated answer branches would narrow down the solution space.

      # Select
      Ask the candidate question with the highest expected information gain: {{selected_question}}. Repeat with the updated conversation state until the task is solved or a turn budget is reached.
    variables:
    - name: conversation_state
      description: Everything established so far in the information-seeking dialogue
      example: null
    - name: candidate_questions
      description: Candidate follow-up questions being considered
      example: null
    - name: num_simulated_branches
      description: How many possible answer branches to simulate per candidate question
      example: '3'
    - name: selected_question
      description: The question chosen to ask this turn
      example: null
    template_id: uncertainty-of-thoughts--simulate-reward-propagate-question-selection
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
  - agentic
  - information-seeking
  - uncertainty-aware
  - planning
  - multi-call
  status: verified-external
  aliases:
  - UoT
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: rewoo-reasoning-without-observation
  name: ReWOO (Reasoning WithOut Observation)
  category: agentic-tool-use
  subcategory: planning
  executive_summary: Generate the entire multi-step tool-use plan up front, with placeholders for tool
    results, then execute all planned calls afterward — instead of interleaving reasoning and tool calls
    step-by-step like ReAct.
  description: 'Targets a specific inefficiency in ReAct-style interleaved tool use: each tool call halts
    generation, waits for the observation, then resumes, which is straightforward but leads to redundant
    prompts and repeated execution, especially when the same context has to be re-sent at every step.
    ReWOO decouples this into three modules — Planner (produces the full plan with variable placeholders
    like ''#E1 = Search[query]'' up front, without waiting for real results), Worker (executes the planned
    tool calls to fill in the placeholders), and Solver (produces the final answer from the completed
    plan). Reports 5x token efficiency and a 4% accuracy improvement on HotpotQA versus ReAct-style interleaving,
    and demonstrates offloading reasoning ability from 175B GPT-3.5 into a 7B LLaMA via instruction tuning
    on ReWOO-style plans.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Multi-step tool-use tasks where the tool-call sequence can reasonably be planned in full up front,
    and reducing token consumption / redundant re-prompting matters.
  - Tasks where tool-failure robustness matters — ReWOO's decoupled plan is reported more robust to individual
    tool failures than interleaved ReAct.
  when_not_to_use:
  - Tasks where later tool calls genuinely depend on unpredictable results of earlier ones in a way that
    can't be planned upfront — ReAct's interleaved, adaptive approach fits better there.
  known_pitfalls:
  - If little context about the environment/available tools is known in advance, the upfront planner is
    less effective — the paper notes this can be mitigated with few-shot prompting or fine-tuning.
  related_techniques:
  - react
  - plan-and-solve-prompting
  - chain-of-abstraction
  primary_source:
    authors: Xu, Peng, Lei, Mukherjee, Liu, Xu
    year: 2023
    title: 'ReWOO: Decoupling Reasoning from Observations for Efficient Augmented Language Models'
    venue: arXiv preprint
    arxiv_id: '2305.18323'
    url: https://arxiv.org/abs/2305.18323
  usage_templates:
  - template_name: Plan-then-work-then-solve
    template: |-
      # Planner (produces the full plan up front, no tool calls yet)
      Task: {{task}}
      Available tools: {{tool_list}}
      Produce a plan with placeholder variables for each tool result, e.g. '#E1 = {{tool_name}}[query]', '#E2 = {{tool_name}}[query using #E1]': {{full_plan_with_placeholders}}

      # Worker (executes each planned call, filling placeholders)
      Execute {{full_plan_with_placeholders}} step by step, substituting real tool results for each #E placeholder as they resolve.

      # Solver (produces final answer from the completed plan)
      Given the completed plan with all placeholders resolved: {{completed_plan_with_results}}
      Produce the final answer to: {{task}}
    variables:
    - name: task
      description: The overall multi-step task
      example: null
    - name: tool_list
      description: Available tools the planner can reference
      example: null
    - name: tool_name
      description: A specific tool referenced in the plan
      example: null
    - name: full_plan_with_placeholders
      description: 'The complete upfront plan with unresolved #E placeholders'
      example: null
    - name: completed_plan_with_results
      description: The plan after the Worker has resolved every placeholder with real tool results
      example: null
    template_id: rewoo-reasoning-without-observation--plan-then-work-then-solve
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
