- id: factscore
  name: FActScore
  category: self-verification-refinement
  subcategory: atomic-fact-verification
  executive_summary: Decomposes long-form text into atomic facts and verifies each one independently,
    producing a granular factuality score for the entire generation.
  description: FActScore addresses the challenge of evaluating long-form factuality by breaking text into
    atomic, verifiable claims. Each claim is checked against a knowledge source. The ratio of supported
    facts to total facts yields the FActScore.
