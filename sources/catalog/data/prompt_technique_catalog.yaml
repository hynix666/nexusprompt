- id: gcg-adversarial-suffix-attack
  name: 'GCG: Universal Adversarial Suffix Attack'
  category: prompt-injection-defense
  subcategory: threat-modeling
  executive_summary: An automatically-optimized adversarial suffix, appended to a harmful request, reliably
    drives an aligned model toward compliance instead of refusal — and often transfers across different
    models.
  description: 'Uses a combination of greedy and gradient-based discrete search (Greedy Coordinate Gradient)
    to find a token suffix that, appended to a wide range of harmful queries, maximizes the model''s probability
    of an affirmative (''Sure, here is...'') response rather than a refusal. Distinct from hand-crafted
    jailbreak prompts: the suffix is found automatically and the same suffix transfers across different
    open- and closed-weight models, making it a threat-model reference point for how brittle refusal-based
    alignment can be against optimization-based attack, not something one prompt-level review can catch
    reliably.'
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - Red-teaming a deployed system's robustness against optimization-based (not just hand-written) adversarial
    inputs.
  - Threat-modeling whether refusal-based alignment alone is sufficient for a given deployment.
  when_not_to_use:
