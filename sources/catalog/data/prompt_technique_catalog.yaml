  - universal-self-consistency
  - multiagent-debate
  - confidence-informed-self-consistency
  primary_source:
    authors: Saha, Levy, Celikyilmaz, Bansal, Weston, Li
    year: 2023
    title: Branch-Solve-Merge Improves Large Language Model Evaluation and Generation
    venue: arXiv
    arxiv_id: '2310.15123'
    url: https://arxiv.org/abs/2310.15123
  usage_templates:
  - template_name: Parallel sub-criteria evaluation
    template: |-
      Candidates: {{candidates}}
      Evaluation Criteria: {{criteria}}

      Step 1 (Branch): Decompose criteria into sub-criteria.
      Sub-criteria: {{sub_criteria}}

      Step 2 (Solve): Evaluate each candidate on each sub-criterion independently with shuffled ordering.
      Scores: {{sub_criterion_scores}}

      Step 3 (Merge): Aggregate sub-criterion scores via consensus.
      Final Rankings: {{final_rankings}}
    variables:
    - name: candidates
      description: The outputs to evaluate.
      example: '[Response A, Response B, Response C]'
    - name: criteria
      description: The evaluation criteria.
