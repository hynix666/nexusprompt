- id: sglang
  name: SGLang
  category: structured-constrained-output
  subcategory: structured-generation-dsl
  executive_summary: Structured generation DSL with a runtime that reuses KV cache and compiles output
    constraints to a compressed finite state machine. Enables complex output structures (JSON, regex,
    context-free grammars) with high throughput via runtime optimization.
  description: 'SGLang provides a Python-embedded DSL for specifying structured LLM outputs. It supports
    regex constraints, JSON schemas, and context-free grammars. The runtime combines two optimizations:
    RadixAttention, which reuses KV cache across calls, and a compressed finite state machine that speeds
    up structured-output decoding. It also supports fork/join patterns for parallel generation.'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - High-throughput applications requiring structured output (APIs, data extraction).
  - When constrained decoding throughput is a bottleneck.
  - Complex output structures beyond simple JSON (nested objects, regex patterns, grammars).
  when_not_to_use:
  - Simple applications where standard JSON mode is sufficient.
  - When the SGLang runtime is not available for your deployment.
  - When output structure is too complex for current grammar support.
  known_pitfalls:
  - DSL learning curve for developers.
  - Runtime dependency adds deployment complexity.
  - Grammar compilation may fail for overly complex or ambiguous grammars.
  related_techniques:
