  category: prompt-injection-defense
  subcategory: input-transformation
  executive_summary: Input transformation defense that delimits, marks, or encodes untrusted third-party
    content to prevent the model from conflating it with system instructions. Reduces prompt injection
    success rates significantly.
  description: Spotlighting transforms untrusted third-party content — retrieved documents, tool output,
    anything the user did not type — before it reaches the LLM, by adding explicit delimiters, datamarking,
    or encoding that makes the boundary between the user's instructions and that content unmistakable.
