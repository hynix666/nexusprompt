- id: art-automatic-reasoning-tool-use
  name: ART (Automatic Reasoning and Tool-use)
  category: agentic-tool-use
  subcategory: library-based-planning
  executive_summary: A frozen LLM generates a reasoning-plus-tool-use program by selecting relevant demonstrations
    from a library of prior task programs, pausing generation for tool calls — humans can fix or extend
    the library afterward.
  description: 'Predates and is frequently cited as a predecessor to ReWOO and modern agent frameworks:
    rather than hand-crafting task-specific reasoning-plus-tool demonstrations (what ReAct''s prompt author
    has to do per task), ART maintains a task library of prior programs and automatically selects the
    most relevant ones as in-context demonstrations for a new, unseen task — no per-task manual engineering
    required. At inference time, generation pauses whenever the model''s output invokes a tool, the tool
    runs, and its result is spliced back in before generation resumes. Reports substantial improvement
    over few-shot prompting and automatic CoT on unseen BigBench and MMLU tasks, matching hand-crafted
    CoT on most of them, and is explicitly designed for extensibility: a human can correct an error in
    a task-specific program or add a new tool to the library, and the paper demonstrates this human correction
    step drastically improving performance on selected tasks with minimal intervention.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Building a reusable system that needs to generalize reasoning-plus-tool-use to many unseen task types
    over time, where hand-crafting ReAct-style demonstrations per new task type isn't practical.
  - Deployments where a human-in-the-loop correction/extension workflow (fixing one task's program, adding
    a new tool) is a realistic maintenance path.
  when_not_to_use:
  - A single, well-understood task type where hand-crafting one good ReAct or PAL prompt is simpler than
    building and maintaining a task library.
  - No existing library of related task demonstrations to select from, and no plan to build one.
  known_pitfalls:
  - Demonstration-selection quality depends on the task library actually containing relevant precedents
    for a new task; a library with poor coverage of the new task's structure won't automatically generate
    a good program for it.
  related_techniques:
  - react
  - rewoo-reasoning-without-observation
  - pal-program-aided-language-models
  - decomposed-prompting
  primary_source:
    authors: Paranjape, Lundberg, Singh, Hajishirzi, Zettlemoyer, Ribeiro
    year: 2023
    title: 'ART: Automatic Multi-step Reasoning and Tool-use for Large Language Models'
    venue: arXiv preprint
    arxiv_id: '2303.09014'
    url: https://arxiv.org/abs/2303.09014
  usage_templates:
  - template_name: Library-selected demonstrations with pause-resume tool execution
    template: |-
      New task: {{new_task}}
      From the task library {{task_library}}, select the {{num_demonstrations}} most relevant prior task programs as in-context demonstrations: {{selected_demonstrations}}

      {{selected_demonstrations}}

      Q1: {{new_task}}
      #1: [{{tool_name}}] {{tool_query}}
      (generation pauses here; tool executes and returns {{tool_result}}, which is spliced back in before generation resumes)
      #2: ... continue until the task is solved.

      # Human correction (optional, after the fact)
      If task {{new_task}}'s generated program had an error, a human can correct it or add a missing tool to {{task_library}} for future use.
    variables:
    - name: new_task
      description: The new, potentially unseen task to solve
      example: null
    - name: task_library
      description: The library of prior task programs to select demonstrations from
      example: null
    - name: num_demonstrations
      description: How many library demonstrations to select
      example: '3'
    - name: selected_demonstrations
      description: The demonstrations selected as in-context examples
      example: null
    - name: tool_name
      description: Which tool is invoked at this step
      example: null
    - name: tool_query
      description: The query/arguments passed to the tool
      example: null
    - name: tool_result
      description: The tool's returned result, spliced back into generation
      example: null
    template_id: art-automatic-reasoning-tool-use--library-selected-demonstrations-with-pause-resume-tool-execution
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - agentic
  - tool-use
  - library-based
  - extensible
  - multi-call
  status: verified-external
  aliases:
  - ART
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: voyager-lifelong-learning-agent
  name: Voyager (Lifelong Learning Embodied Agent)
  category: agentic-tool-use
  subcategory: skill-library
  executive_summary: An embodied agent that continuously explores an environment, writes and stores reusable,
    verified skills as code, composing learned skills to tackle harder tasks — no demonstrations or gradient
    updates.
  description: 'Extends the library-of-reusable-components idea from ART and RECUBE-style approaches into
    a fully autonomous, continuously-learning agent loop: an automatic curriculum proposes the next exploration
    goal based on the agent''s current state and skill library, an iterative prompting mechanism generates
    executable code to accomplish that goal (using environment feedback, execution errors, and self-verification
    to refine the code across attempts), and successfully verified skills are added as reusable functions
    to a growing library that later, more complex skills can call. Demonstrated in Minecraft, obtaining
    3.3x more unique items, traveling 2.3x longer distances, and unlocking key tech-tree milestones up
    to 15.3x faster than prior state-of-the-art approaches, with skills the agent learned proving directly
    transferable to solving new tasks from scratch.'
  verification_status: unverifiable-by-text
  cost_profile: agentic-loop
  when_to_use:
  - Open-ended environments where the agent needs to autonomously discover its own curriculum of increasingly
    complex sub-goals and build genuinely reusable capabilities over a long horizon, rather than being
    given a fixed task to solve once.
  when_not_to_use:
  - Bounded, single-shot tasks with a fixed known goal — the autonomous curriculum and skill-library machinery
    is substantial overhead not needed for a one-off task ART or ReAct already handle well.
  known_pitfalls:
  - Skill library growth is only useful if skills are genuinely composable and correctly verified before
    being stored — a poorly verified skill added to the library can propagate errors into everything built
    on top of it later.
  related_techniques:
  - art-automatic-reasoning-tool-use
  - reflexion
  - generative-agents-memory-architecture
  primary_source:
    authors: Wang, Xie, Jiang, Mandlekar, Xiao, Zhu, Fan, Anandkumar
    year: 2023
    title: 'Voyager: An Open-Ended Embodied Agent with Large Language Models'
    venue: arXiv preprint
    arxiv_id: '2305.16291'
    url: https://arxiv.org/abs/2305.16291
  usage_templates:
  - template_name: Automatic curriculum + iterative skill synthesis + library growth
    template: |-
      # Automatic curriculum
      Current agent state: {{agent_state}}
      Current skill library: {{skill_library}}
      Propose the next exploration goal that's achievable but pushes beyond current capabilities: {{next_goal}}

      # Iterative skill synthesis (repeat with feedback until verified)
      Goal: {{next_goal}}
      Available skills to compose: {{skill_library}}
      Write executable code to accomplish this goal, reusing library skills where applicable: {{generated_code}}
      Execution feedback/errors: {{execution_feedback}}
      Self-verify: did this achieve the goal? {{verification_result}}
      If not verified, revise {{generated_code}} using the feedback and retry.

      # Add to library (once verified)
      Add the verified skill for '{{next_goal}}' to {{skill_library}} as a reusable, named function for future composition.
    variables:
    - name: agent_state
      description: The agent's current state/inventory/capabilities in the environment
      example: null
    - name: skill_library
      description: The growing library of previously verified, reusable skills
      example: null
    - name: next_goal
      description: The proposed next exploration goal
      example: null
    - name: generated_code
      description: Executable code generated to accomplish the current goal
      example: null
    - name: execution_feedback
      description: Environment feedback or errors from running the generated code
      example: null
    - name: verification_result
      description: Whether the goal was successfully verified as achieved
      example: null
    template_id: voyager-lifelong-learning-agent--automatic-curriculum-iterative-skill-synthesis-library-growth
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
