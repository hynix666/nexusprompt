- id: struq-structured-queries
  name: 'StruQ: Structured-Query Defense'
  category: prompt-injection-defense
  subcategory: structural-defense
  executive_summary: Separate prompt (instructions) and data into distinct channels at the front end,
    and train the model to only ever take instructions from the prompt channel — a structural, training-time
    defense against injection.
  description: Rather than relying purely on text-level delimiters within a single context, StruQ physically
    separates instruction and data into different input channels and fine-tunes the model to disregard
    instruction-like content appearing in the data channel. A training-time analogue to the text-isolation
    approach (delimiters/nonces) usable at inference time without retraining.
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - Building or fine-tuning a model specifically for a deployment where prompt/data separation is achievable
    end-to-end (both training and serving support the structured-channel format).
  when_not_to_use:
  - Working with a fixed, already-trained model where fine-tuning isn't an option — use text-level isolation
    (nonces/delimiters) instead as an inference-time substitute.
  known_pitfalls:
  - Requires control over model fine-tuning; not applicable as a pure prompting-layer defense on top of
