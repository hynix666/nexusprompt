- id: rephrase-and-respond
  name: Rephrase and Respond (RaR)
  category: template-pattern-scaffolding
  subcategory: self-clarification
  executive_summary: Have the model rephrase and expand the question itself before answering it, letting
    the model ask itself a clearer version of an ambiguous or underspecified question.
  description: 'A lightweight, single-call technique: the prompt asks the model to first restate and elaborate
