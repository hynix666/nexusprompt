- id: dera
  name: DERA (Dialog-Enabled Resolving Agents)
  category: agentic-tool-use
  subcategory: researcher-decider-dialog
  executive_summary: 'Split generation into two agent roles that hold a dialog: a Researcher that surfaces
    the crucial components of the problem, and a Decider that integrates them and owns the final output.
    Aimed at factual accuracy and completeness in safety-critical text.'
  description: 'DERA frames output improvement as a conversation between two agent types rather than as
    a critique loop. The Researcher processes the available information and identifies the components
    of the problem that matter; the Decider has the autonomy to integrate what the Researcher surfaces
    and to make the judgment calls that fix the final output. The asymmetry is the point: one role widens
    the field of considerations, the other narrows it and remains accountable for what ships, which keeps
    the dialog from collapsing into two agents negotiating. Nair et al. evaluate it on three clinically-focused
    tasks, where the governing criterion is whether the output is factually accurate and complete rather
    than whether it is stylistically better; gains are reported in human evaluation of medical conversation
    summarization and care plan generation.'
  verification_status: judge-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Output must be factually complete, and omissions matter as much as errors — clinical summaries, incident
    reports, compliance text.
  - A single pass reliably misses considerations that a second reader would raise.
  - Someone or something must remain accountable for the final text, so a symmetric multi-agent debate
    is the wrong shape.
  when_not_to_use:
  - The task has a checkable answer, where a verifier or test beats a second model's judgment.
  - Latency or cost rules out a multi-turn dialog per output.
  - The domain is one where neither agent has grounding, in which case the dialog compounds error rather
    than removing it.
  known_pitfalls:
  - 'The Decider inherits the Researcher''s blind spots: anything neither role surfaces is invisible to
    the process.'
  - Role separation degrades if both agents share a prompt and a model without distinct instructions,
    collapsing into one voice agreeing with itself.
  - Reported gains are strongest on human evaluation of completeness; automated metrics moved far less,
    so evaluate on what you actually care about.
  related_techniques:
  - self-refine
  - chain-of-verification
  - medprompt-framework
  primary_source:
    authors: Nair, Schumacher, Tso, Kannan
    year: 2023
    title: 'DERA: Enhancing Large Language Model Completions with Dialog-Enabled Resolving Agents'
    venue: arXiv
    arxiv_id: '2303.17071'
    url: https://arxiv.org/abs/2303.17071
  usage_templates:
  - template_name: Researcher / Decider dialog
    template: |-
      You are the RESEARCHER. Read the source material and the draft output. List the components of the problem that matter for correctness and completeness, and any information in the source that the draft has not used. Do not rewrite the output.

      Source material:
      {{source_material}}

      Draft output:
      {{draft_output}}

      ---

      You are the DECIDER. You own the final text. Take the Researcher's list, decide which items belong in the output and which do not, and produce the corrected version. State briefly which items you rejected and why.

      Researcher's findings:
      {{researcher_findings}}
    variables:
    - name: source_material
      description: The ground-truth material the output must reflect.
      example: Transcript of a patient consultation.
    - name: draft_output
      description: The first-pass generation to be resolved.
      example: Draft visit summary.
    - name: researcher_findings
      description: The Researcher turn's output, passed to the Decider.
      example: Medication change discussed at 04:12 is missing from the summary.
    template_id: dera--researcher-decider-dialog
    determinism: stochastic-by-design
    reproducibility_note: Two or more model calls per output, with the Decider's input depending on the
      Researcher's turn. Fix both prompts, the model and the turn limit to reproduce; the dialog length
      varies with what the Researcher surfaces.
  tags:
  - agent
  - dialogue
  - multi-agent
  - factuality
  - clinical
  status: verified-external
  aliases:
  - DERA
  - Dialog-Enabled Resolving Agents
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: verify-and-edit
  name: Verify-and-Edit
  category: self-verification-refinement
  subcategory: post-hoc-correction
  executive_summary: Post-hoc verification pipeline that checks generated claims against external knowledge
    and edits incorrect claims in-place. Addresses hallucination by retrofitting facts rather than regenerating
    entire outputs.
  description: 'Verify-and-Edit operates in two stages: (1) Verification — reasoning chains whose answers
    the model is uncertain about are checked against an external knowledge source (retrieval, database,
    or search), and (2) Editing — claims flagged as incorrect are replaced with corrected versions while
    preserving the overall structure and flow of the output. This is more efficient than full regeneration
    because only incorrect parts are rewritten.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Long-form generation where specific facts need verification.
  - When full regeneration is too expensive or slow.
  - Domains with reliable external knowledge sources (Wikipedia, medical databases).
  when_not_to_use:
  - When no reliable external knowledge source exists.
  - Creative writing where factual correctness is not the goal.
  - When claims are so intertwined that editing one breaks coherence.
  known_pitfalls:
  - Verification source may be incomplete or outdated.
  - Editing may disrupt stylistic consistency of the original text.
  - Claim decomposition itself can be error-prone.
  related_techniques:
  - factscore
  - rarr
  - selfcheckgpt
  - chain-of-verification
  primary_source:
    authors: Zhao, Li, Joty, Qin, Bing
    year: 2023
    title: 'Verify-and-Edit: A Knowledge-Enhanced Chain-of-Thought Framework'
    venue: arXiv
    arxiv_id: '2305.03268'
    url: https://arxiv.org/abs/2305.03268
  usage_templates:
  - template_name: Claim verification and in-place editing
    template: |-
      Generated Text: {{generated_text}}

      Step 1: Decompose into atomic claims.
      Claims: {{claims}}

      Step 2: Verify each claim against external knowledge.
      Verification Results: {{verification_results}}

      Step 3: Edit incorrect claims in-place.
      Edited Text: {{edited_text}}

      Preserve original structure and style while correcting facts.
    variables:
    - name: generated_text
      description: The text to verify and edit.
      example: The Eiffel Tower was built in 1887 and is located in London.
    - name: claims
      description: Decomposed atomic claims.
      example: '["Eiffel Tower built in 1887", "Eiffel Tower located in London"]'
    - name: verification_results
      description: Per-claim verification.
      example: '[Correct, Incorrect: actually in Paris]'
    - name: edited_text
      description: Text with incorrect claims corrected.
      example: The Eiffel Tower was built in 1887 and is located in Paris.
    template_id: verify-and-edit--claim-correction
    determinism: deterministic-at-temperature-zero
    reproducibility_note: Verification and editing should be deterministic. Results depend on external
      knowledge source coverage and freshness.
  tags:
  - verification
  - correction
  - editing
  - post-hoc
  status: verified-external
  aliases:
  - Verify and Edit
  - Post-hoc Correction
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: codet
  name: CodeT (Code Generation with Testers)
  category: agentic-tool-use
  subcategory: code-generation-ensemble
  executive_summary: Generate-and-test ensemble for code generation. Has the model generate both candidate
    solutions and test cases, then selects by execution agreement across them. Improves code correctness
    over single-sample generation.
  description: 'CodeT has the model generate both candidate solutions and test cases for the same problem,
    removing the need for hand-written tests. Solutions are then executed against those generated tests
    and scored by dual execution agreement: a solution is trusted when it agrees with other solutions
    on the tests they pass, so consensus across the sampled pairs — not a single test suite — does the
    selecting. This significantly improves functional correctness over single-sample code generation.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Code generation tasks with available test cases.
  - Competitive programming and software engineering benchmarks.
  - When code correctness is more important than generation speed.
  when_not_to_use:
  - When no test cases are available for verification.
  - When compilation/execution environments are unavailable or unsafe.
  - When latency requirements prohibit multi-sample generation and testing.
  known_pitfalls:
  - Test cases may be incomplete (passing all tests does not guarantee correctness).
  - Compilation errors may discard valid but syntactically unconventional solutions.
  - Execution of untrusted code requires sandboxing.
  related_techniques:
  - program-of-thoughts
  - self-consistency
  - swe-agent
  - chain-of-code
  primary_source:
    authors: Chen, Zhang, Nguyen, Zan, Lin, Lou, Chen
    year: 2022
    title: 'CodeT: Code Generation with Generated Tests'
    venue: arXiv
    arxiv_id: '2207.10397'
    url: https://arxiv.org/abs/2207.10397
  usage_templates:
  - template_name: Generate-test-select ensemble
    template: |-
      Programming Problem: {{problem}}

      Step 1: Generate {{n}} candidate solutions.
      Candidates: {{candidates}}

      Step 2: Filter by compilation.
      Compiling Candidates: {{compiling_candidates}}

      Step 3: Execute against test cases.
      Test Results: {{test_results}}

      Step 4: Select candidate with highest test pass rate.
      Selected Solution: {{selected_solution}}
    variables:
    - name: problem
      description: The programming problem.
      example: Write a function to check if a binary tree is balanced.
    - name: n
      description: Number of candidate solutions to generate.
      example: '10'
    - name: candidates
      description: Generated code candidates.
      example: '[def is_balanced_1(root): ..., def is_balanced_2(root): ...]'
    - name: compiling_candidates
      description: Candidates that successfully compile.
      example: '[is_balanced_1, is_balanced_3, is_balanced_7]'
    - name: test_results
      description: Test execution results per candidate.
      example: '{is_balanced_1: 5/5, is_balanced_3: 4/5, is_balanced_7: 5/5}'
    - name: selected_solution
      description: The final selected code.
      example: 'def is_balanced(root): ... (passes all tests)'
    template_id: codet--generate-test-select
    determinism: stochastic-by-design
    reproducibility_note: Code generation is non-deterministic at temperature > 0. Compilation and test
      execution are deterministic. Selection is deterministic based on pass rates.
  tags:
  - code
  - ensemble
  - testing
  - compilation
  status: verified-external
  aliases:
  - CodeT
