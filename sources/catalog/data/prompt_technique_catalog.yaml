- id: instruction-hierarchy
  name: The Instruction Hierarchy (Privileged Instructions)
  category: prompt-injection-defense
  subcategory: privilege-model
  executive_summary: Train models to prioritize instructions by source privilege — system over developer
    over user over third-party content — so lower-privilege text can never override higher-privilege ones.
  description: 'Formalizes instruction privilege as an explicit, trainable, checkable property rather
    than an implicit assumption: defines a strict ordering of instruction sources (system > developer
    > user > tool/third-party content) and trains the model to resolve conflicts by source privilege rather
    than recency or phrasing. The strongest existing academic match for any project''s own privilege/authority
    lattice design.'
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - Designing a system with multiple instruction sources of differing trust levels (system prompt, developer
    instructions, end-user input, third-party/tool content).
  when_not_to_use:
  - Single-source-of-instruction systems with no privilege distinctions to enforce.
  known_pitfalls:
  - Privilege modeling still requires the model to correctly attribute which channel a given piece of
    text came from; misattribution defeats the hierarchy.
  related_techniques:
  - struq-structured-queries
  - prompt-injection-attack-taxonomy
  - indirect-prompt-injection
  primary_source:
