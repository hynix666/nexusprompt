      example: '{A: [9,8,7], B: [8,9,8], C: [7,7,9]}'
    - name: final_rankings
      description: Final ranking after aggregation.
      example: 1. B (25), 2. A (24), 3. C (23)
    template_id: branch-solve-merge--parallel-evaluation
