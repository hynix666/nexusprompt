      Query: {{query}}
      Retrieved Documents: {{documents}}

      Step 1: Pass documents through trained compressor.
      Mode: {{compression_mode}}  [extractive / abstractive]

      Step 2: Compressor outputs concise representations.
      Compressed: {{compressed_documents}}

      Step 3: Use compressed documents as context for generation.
      Answer: {{answer}}
    variables:
    - name: query
      description: The user query.
      example: What are the benefits of renewable energy?
