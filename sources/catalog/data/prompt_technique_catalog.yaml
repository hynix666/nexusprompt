    url: https://arxiv.org/abs/2310.03714
  usage_templates:
  - template_name: Declarative module + compile step
    template: |-
      # Declare pipeline structure (pseudocode, framework-specific in practice)
      module_1 = {{module_1_signature}}  # e.g. 'question -> search_query'
      module_2 = {{module_2_signature}}  # e.g. 'context, question -> answer'

      # Compile
      Given a training set {{training_examples}} and metric {{eval_metric}}, the teleprompter searches for prompt wording and/or few-shot demonstrations for module_1 and module_2 that maximize {{eval_metric}} on {{training_examples}}.
