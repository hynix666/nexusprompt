    instruction is reinforced with an explicit hacking-style prompt. The most directly applicable external
    benchmark for any agentic-tool-use technique in this catalog (ReAct, Plan-and-Solve, Meta-Prompting)
    that ingests tool output into its own reasoning loop.'
