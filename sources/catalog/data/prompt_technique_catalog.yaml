- id: self-instruct
  name: Self-Instruct
  category: automatic-prompt-optimization
  subcategory: bootstrapped-instruction-data
  executive_summary: Bootstrap a large set of instruction-following training examples from a small human-written
    seed set, by having the model generate new instructions, inputs, and outputs itself.
  description: Starting from a small seed pool of human-written tasks, the model is prompted to generate
    new task instructions, then corresponding inputs and outputs for those instructions, with filtering
    steps to remove low-quality or duplicate generations. The result is a large instruction-tuning dataset
    produced with minimal human annotation. Conceptually the ancestor of later self-referential improvement
    loops such as Promptbreeder.
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - Bootstrapping instruction-following training data with a small human-written seed set and limited
    annotation budget.
  when_not_to_use:
  - Inference-time-only use cases with no training/fine-tuning step.
  known_pitfalls:
  - Quality depends heavily on the filtering step; ungated bootstrapping can amplify low-quality or repetitive
    generations across iterations.
  related_techniques:
