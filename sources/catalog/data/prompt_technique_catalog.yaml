- id: modularization-of-thought-code-gen
  name: Modularization-of-Thought (MoT) for Code Generation
  category: domain-specific-application
  subcategory: code-generation
  executive_summary: Decompose a code-generation task into modular sub-problems before writing any code,
    mirroring how a human engineer would break a large function into smaller helper functions.
  description: 'Applies decomposition-style reasoning (in the spirit of Least-to-Most Prompting) specifically
    to code: identify natural module/function boundaries in the target program before generating any implementation,
    then generate each module with awareness of the others'' interfaces.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
