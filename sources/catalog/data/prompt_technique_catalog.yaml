  usage_templates:
  - template_name: Question-aware coarse-to-fine compression
    template: |-
      Question: {{question}}
      Documents: {{documents}}

      Step 1 (Coarse): Score each document for question relevance.
      Retain top-{{k}} documents: {{retained_documents}}

      Step 2 (Fine): Within retained documents, score each token for question relevance.
      Compress by removing low-relevance tokens while preserving coherence.
      Compressed context: {{compressed_context}}

      Step 3: Answer question from compressed context.
    variables:
    - name: question
      description: The user question.
