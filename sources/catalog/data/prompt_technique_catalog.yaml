- id: chain-of-code
  name: Chain-of-Code (CoC)
  category: reasoning-elicitation
  subcategory: hybrid-code-reasoning
  executive_summary: Bridges the gap between Program-of-Thoughts (PoT) and natural language reasoning
    by using a "LMulator" — an LLM-based interpreter that executes pseudo-code when a real interpreter
    fails.
  description: CoC generates reasoning as executable or pseudo-executable code. When the code can be executed
    by a real interpreter (Python), it is. When the code contains semantic operations that no interpreter
    supports (e.g., "sort by importance"), the LMulator (an LLM prompted to simulate execution) steps
    in. This hybrid approach handles both formal and fuzzy reasoning.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Tasks requiring both precise computation and semantic judgment.
  - When PoT fails because operations are not expressible in standard code.
  - Domains like data analysis where code and natural language reasoning interleave.
  when_not_to_use:
  - Tasks that are purely natural language with no computational component.
  - When code execution environments are unavailable or unsafe.
  - When the overhead of dual execution paths is not justified.
  known_pitfalls:
  - The LMulator may hallucinate execution results for ambiguous operations.
  - Switching between real interpreter and LMulator adds complexity.
  - Debugging hybrid traces is harder than pure code or pure text.
  related_techniques:
  - program-of-thoughts
  - chain-of-thought
  - algorithm-of-thoughts
  - chain-of-symbol
  primary_source:
    authors: Li, Liang, Zeng, Chen, Hausman, Sadigh, Levine, Fei-Fei, Xia, Ichter
    year: 2023
    title: 'Chain of Code: Reasoning with a Language Model-Augmented Code Emulator'
    venue: arXiv
    arxiv_id: '2312.04474'
    url: https://arxiv.org/abs/2312.04474
  usage_templates:
  - template_name: Hybrid code execution with LMulator fallback
    template: |-
      Task: {{task}}

      Generate reasoning as executable code:
      {{generated_code}}

      Attempt real execution:
      - If executable: use Python output.
      - If not executable (semantic operation): invoke LMulator.
        LMulator prompt: "Simulate executing: {{semantic_operation}}"
        LMulator output: {{simulated_result}}

      Combine real and simulated outputs for final answer.
    variables:
    - name: task
      description: The task requiring hybrid reasoning.
      example: Find the most important themes in this dataset and compute their frequency.
    - name: generated_code
      description: The code generated by the model.
      example: themes = extract_themes(data); important_themes = sort_by_importance(themes); frequencies
        = compute_freq(important_themes)
    - name: semantic_operation
      description: The operation that requires LMulator simulation.
      example: sort_by_importance(themes)
    - name: simulated_result
      description: The LMulator-simulated execution result.
      example: '["climate impact", "policy response", "economic cost"]'
    template_id: chain-of-code--hybrid-execution
    determinism: stochastic-by-design
    reproducibility_note: Real code execution is deterministic. LMulator simulation is non-deterministic.
      Set temperature=0 for LMulator to maximize reproducibility.
