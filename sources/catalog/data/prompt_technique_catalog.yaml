- id: adaptive-rag
  name: Adaptive RAG
  category: retrieval-augmentation
  subcategory: query-routing
  executive_summary: Routes queries to different retrieval strategies based on query complexity. Simple
    queries use single-pass retrieval; complex queries use iterative or multi-source retrieval.
  description: Adaptive RAG classifies incoming queries by complexity (e.g., simple factual lookup vs.
    multi-hop synthesis) and routes them to the appropriate retrieval pipeline. Simple queries go to standard
    vector retrieval; complex queries trigger iterative retrieval, decomposition, or multi-source fusion.
    This optimizes the cost-accuracy tradeoff by avoiding expensive retrieval for easy questions.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
