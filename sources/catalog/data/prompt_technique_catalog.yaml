    - name: retained_documents
      description: Documents kept after coarse filtering.
      example: Doc 1, Doc 3, Doc 5
    - name: compressed_context
      description: Final compressed text after fine token removal.
      example: 'Metformin side effects: gastrointestinal upset, vitamin B12 deficiency, lactic acidosis
        (rare)...'
    template_id: longllmlingua--coarse-fine
    determinism: deterministic-at-temperature-zero
