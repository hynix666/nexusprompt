      </context>

      <user_query>
        {{query}}
      </user_query>

      <output_format>
        {{schema_or_template}}
      </output_format>
    variables:
    - name: system_instructions
      description: Trusted system instructions.
      example: You are a helpful assistant. Answer based only on the provided context.
