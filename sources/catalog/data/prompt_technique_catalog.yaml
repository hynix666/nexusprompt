- id: ask-me-anything
  name: Ask Me Anything (Prompt Ensembling via Weak Supervision)
  category: template-pattern-scaffolding
  subcategory: prompt-ensembling
  executive_summary: Aggregate answers from several deliberately imperfect prompts via weak supervision,
    instead of searching for one single 'best' prompt.
  description: Rather than hunting for an optimal prompt, generates several open-ended question-style
    prompts for the same underlying task (each individually noisy/imperfect), collects their outputs,
    and combines them with a weak-supervision aggregation model that accounts for each prompt's estimated
    reliability and correlations between prompts. Reframes prompt design from a single-point optimization
    problem to an ensembling problem.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - No single prompt reliably captures the task, but several different framings each capture it partially
    and imperfectly.
  when_not_to_use:
  - A single well-tested prompt already performs reliably — ensembling adds cost without a clear benefit.
  known_pitfalls:
  - Weak-supervision aggregation assumes some structure in how prompts correlate/err; a poorly chosen
    aggregation model can itself introduce bias.
  related_techniques:
