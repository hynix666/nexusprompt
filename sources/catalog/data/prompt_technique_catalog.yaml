- id: faithful-chain-of-thought
  name: Faithful Chain-of-Thought
  category: reasoning-elicitation
  subcategory: faithful-reasoning
  executive_summary: Split reasoning into a Translation stage (query → symbolic reasoning chain) and a
    Problem Solving stage handled by a deterministic solver, guaranteeing the stated reasoning is what
    actually produced the answer.
  description: 'Directly addresses a specific gap plain CoT has: the generated reasoning chain does not
    necessarily reflect how the model actually arrived at its answer (unfaithfulness), which undermines
    using CoT text as an interpretability signal. Faithful CoT''s two-stage architecture — translate the
    query into an explicit symbolic form (e.g. a program or logical expression), then hand that off to
    a deterministic external solver rather than having the LM ''solve'' it in free text — guarantees the
    reasoning chain is a faithful explanation of the final answer by construction, not just plausible-looking.
    Outperforms standard CoT on 9 of 10 benchmarks across 4 domains.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Tasks where the reasoning trace itself needs to be trustworthy as an explanation (auditing, high-stakes
    decisions), not just the final answer.
  - Domains with a natural symbolic representation (math, logic, some planning tasks) and an available
    deterministic solver.
  when_not_to_use:
  - Open-ended tasks with no natural symbolic translation or deterministic solver to hand off to.
  known_pitfalls:
  - Faithfulness is only as good as the Translation stage — if the natural-language-to-symbolic translation
    itself misrepresents the query, the 'faithful' chain is faithfully wrong.
  related_techniques:
  - chain-of-thought
  - program-of-thoughts
  - chain-of-verification
  primary_source:
    authors: Lyu, Havaldar, Stein, Zhang, Rao, Wong, Apidianaki, Callison-Burch
    year: 2023
    title: Faithful Chain-of-Thought Reasoning
    venue: arXiv preprint
    arxiv_id: '2301.13379'
    url: https://arxiv.org/abs/2301.13379
  usage_templates:
  - template_name: Translate-then-solve with a deterministic solver
    template: |-
      # Stage 1 — Translation
      Translate this query into a symbolic reasoning chain (e.g. a short program or logical expression) that a deterministic solver could execute: {{natural_language_query}}

      # Stage 2 — Problem Solving (deterministic, not another LM call)
      Execute {{symbolic_reasoning_chain}} with {{deterministic_solver}} to produce the final answer. The executed chain is, by construction, a faithful explanation of how the answer was reached.
    variables:
    - name: natural_language_query
      description: The original query in natural language
      example: null
    - name: symbolic_reasoning_chain
      description: Output of the Translation stage
      example: null
    - name: deterministic_solver
      description: The external solver executing the symbolic chain (e.g. a Python interpreter, a logic
        solver)
      example: null
    template_id: faithful-chain-of-thought--translate-then-solve-with-a-deterministic-solver
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - reasoning
  - faithfulness
  - interpretability
  - multi-call
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: self-discover
  name: Self-Discover
  category: reasoning-elicitation
  subcategory: structure-composition
  executive_summary: Have the model select, adapt, and compose atomic reasoning modules into a task-specific
    reasoning structure before solving, instead of applying one fixed technique like CoT to every task.
  description: 'Argues that CoT, Least-to-Most, and Step-Back each make an implicit, fixed assumption
    about how to approach a task — but every task has its own intrinsic reasoning structure, and no single
    atomic technique fits all of them. Self-Discover works in two stages: an offline stage where the model
    selects relevant atomic reasoning modules from a set (analogy to human strategies like ''use critical
    thinking'', ''break into subproblems''), adapts each to the task, then composes them into an explicit
    task-specific reasoning structure (a JSON-like plan); and an online stage where that discovered structure
    guides the actual per-instance reasoning. Reports substantial gains over CoT on reasoning-heavy benchmarks
    (BigBench-Hard, Thinking for Doing, MATH) with 10-40x less inference compute than some other multi-path
    methods.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - A task's reasoning structure isn't known in advance and a fixed single technique (plain CoT, Least-to-Most)
    may be a poor match for it.
  - You want the structure-discovery cost amortized once (offline stage) and reused across many task instances
    of the same type.
  when_not_to_use:
  - The task's reasoning structure is already well understood and a specific technique (e.g. Program-of-Thoughts
    for numerical tasks) is already known to fit — the discovery overhead is unnecessary.
  known_pitfalls:
  - Discovery quality depends on the model correctly selecting and composing modules from the given set;
    a poorly composed structure constrains every downstream per-instance reasoning pass.
  related_techniques:
  - chain-of-thought
  - least-to-most-prompting
  - meta-prompting
  primary_source:
    authors: Zhou, Pujara, Ren, Chen, Cheng, Le, Chi, Zhou, Mishra, Zheng
    year: 2024
    title: 'Self-Discover: Large Language Models Self-Compose Reasoning Structures'
    venue: NeurIPS 2024
    arxiv_id: '2402.03620'
    url: https://arxiv.org/abs/2402.03620
  usage_templates:
  - template_name: Discover-then-apply reasoning structure
    template: |-
      # Offline: discover the structure (once per task type)
      Available reasoning modules: {{module_list}}
      Task description: {{task_description}}
      SELECT the modules relevant to this task, ADAPT each to the task's specifics, then IMPLEMENT them as a structured, step-by-step reasoning plan (a JSON-like key-value structure): {{discovered_reasoning_structure}}

      # Online: apply the structure (per instance)
      Reasoning structure: {{discovered_reasoning_structure}}
      Instance: {{task_instance}}
      Follow the structure step by step to solve this instance.
    variables:
    - name: module_list
      description: Set of atomic reasoning module descriptions to select from
      example: null
    - name: task_description
      description: General description of the task type
      example: null
    - name: discovered_reasoning_structure
      description: The composed, task-specific reasoning plan from the offline stage
      example: null
    - name: task_instance
      description: A specific instance of the task to solve using the discovered structure
      example: null
    template_id: self-discover--discover-then-apply-reasoning-structure
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - structure-discovery
  - multi-call
  - reusable
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: boosting-of-thoughts
  name: Boosting of Thoughts (BoT)
  category: reasoning-elicitation
  subcategory: multi-path-reasoning
  executive_summary: Iteratively explore and self-evaluate many trees of thoughts, using error analysis
    on failed attempts to explicitly revise the prompt for the next round — accumulated trial-and-error
    becomes the prompt itself.
  description: 'Starts from a simple prompt requiring no exemplars, then automates the trial-and-error
    process a human prompt engineer would otherwise do by hand: it iteratively grows and evaluates a large
    collection of Tree-of-Thoughts-style reasoning steps, extracts error analysis from the model''s own
    assessment of the weak/failed branches, and uses that analysis to explicitly revise the prompt guiding
    the next round of exploration. The accumulated trial-and-error experience across rounds becomes a
    new form of prompt in its own right, distinguishing it from ToT''s single-pass search.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Complex problems (the paper demonstrates extensive mathematical problem-solving) where a single ToT-style
    search pass isn't sufficient and iterative refinement based on the model's own error diagnosis would
    help.
  when_not_to_use:
  - Simple tasks where a single CoT or ToT pass already succeeds reliably — the iterative trial-and-error
    loop adds unnecessary cost.
  known_pitfalls:
  - Cost is adaptive and can grow substantially across rounds; needs a stopping rule (final answer reached,
    or round budget exhausted) to bound expense.
  related_techniques:
  - tree-of-thoughts
  - self-refine
  - self-discover
  primary_source:
    authors: Chen, Li, Niu
    year: 2024
    title: 'Boosting of Thoughts: Trial-and-Error Problem Solving with Large Language Models'
    venue: ICLR 2024
    arxiv_id: '2402.11140'
    url: https://arxiv.org/abs/2402.11140
  usage_templates:
  - template_name: Iterative explore-evaluate-revise trial-and-error loop
    template: |-
      # Round 1
      Problem: {{problem}}
      Explore {{num_branches}} distinct reasoning trees toward a solution.

      # Evaluate
      For each branch, self-evaluate correctness and identify specific errors in the weak/failed branches: {{error_analysis}}

      # Revise prompt for next round
      Given this error analysis: {{error_analysis}}
      Revise the guiding prompt to explicitly steer away from these errors: {{revised_prompt}}

      # Repeat rounds 2..N with the revised prompt until a verified final answer is reached or the round budget {{max_rounds}} is exhausted.
    variables:
    - name: problem
      description: The complex problem being solved
      example: null
    - name: num_branches
      description: How many reasoning trees to explore per round
      example: '5'
    - name: error_analysis
      description: Model-generated diagnosis of what went wrong in failed branches
      example: null
    - name: revised_prompt
      description: The prompt for the next round, revised based on error analysis
      example: null
    - name: max_rounds
      description: Round budget cutoff
      example: '5'
    template_id: boosting-of-thoughts--iterative-explore-evaluate-revise-trial-and-error-loop
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
  - reasoning
  - search
  - trial-and-error
  - multi-call
  - self-revision
  status: verified-external
  aliases:
  - BoT
  secondary_sources: []
