- id: truncproof-json-guardrail
  name: 'TruncProof: JSON Generation Guardrail under Token-Length Constraints'
  category: structured-constrained-output
  subcategory: budget-aware-output
  executive_summary: Keep JSON output valid and complete under a hard token budget, instead of truncating
    mid-structure when the budget runs out.
  description: 'Addresses a specific failure mode of budget-constrained structured generation: naive truncation
    at a token limit can cut a JSON object off mid-key or mid-value, producing invalid output. This guardrail
    manages the generation process so that, if the budget is going to be exceeded, the output degrades
    gracefully (e.g. by omitting whole optional fields) rather than truncating into invalid syntax.'
