- id: algorithm-of-thoughts
  name: Algorithm of Thoughts (AoT)
  category: reasoning-elicitation
  subcategory: multi-path-reasoning
  executive_summary: Show the model in-context examples of algorithmic exploration (not just answers),
    so it internalizes backtracking and pruning from a single query, instead of needing an external multi-query
    tree-search loop.
  description: 'Targets the query-cost problem multi-query methods like Tree of Thoughts incur: those
    methods repeatedly halt, evaluate, and resume generation across many separate LLM calls, escalating
    cost. AoT instead encodes algorithmic exploration patterns (the kind of backtracking and pruning a
    search algorithm performs) directly into the in-context exemplars, exploiting the model''s own recurrence
    dynamics so it can explore an idea space within a single or a few generations rather than needing
    an external control loop to orchestrate that exploration. Demonstrated competitive with multi-query
    tree-search methods on Game of 24 and 5x5 mini crosswords while using substantially fewer tokens and
    queries.'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Search-like reasoning problems (constraint satisfaction, puzzles, combinatorial search) where Tree-of-Thoughts-style
    exploration is valuable but its multi-query cost is a binding constraint.
  when_not_to_use:
  - Simple problems with no real branching search space — the algorithmic-exemplar overhead is unnecessary.
  - Problems where the exemplar author can't articulate a clear search/backtrack pattern to demonstrate
    in-context.
  known_pitfalls:
  - Requires hand-authoring exemplars that actually demonstrate algorithmic exploration (not just a final
    answer), which is a harder exemplar-design task than writing a standard CoT chain.
  related_techniques:
  - tree-of-thoughts
  - self-consistency
  primary_source:
    authors: Sel, Al-Tawaha, Khattar, Jia, Jin
    year: 2023
    title: 'Algorithm of Thoughts: Enhancing Exploration of Ideas in Large Language Models'
    venue: arXiv preprint
    arxiv_id: '2308.10379'
    url: https://arxiv.org/abs/2308.10379
  usage_templates:
  - template_name: Algorithmic-exploration exemplar
    template: |-
      Here is an example of solving a similar problem by exploring multiple paths, backtracking from dead ends, and pruning unpromising branches:
      {{worked_algorithmic_exemplar_with_backtracking}}

      Now solve this problem the same way, exploring paths and backtracking as needed within your response: {{target_problem}}
    variables:
    - name: worked_algorithmic_exemplar_with_backtracking
      description: A worked example explicitly showing exploration, backtracking, and pruning, not just
        a final answer
      example: null
    - name: target_problem
      description: The problem to solve using the same algorithmic exploration pattern
      example: null
    template_id: algorithm-of-thoughts--algorithmic-exploration-exemplar
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - search
  - single-call
  - efficiency
  status: verified-external
  aliases:
  - AoT
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: decomposed-prompting
  name: Decomposed Prompting
  category: reasoning-elicitation
  subcategory: decomposition
  executive_summary: Break a complex task into sub-tasks, then hand each sub-task to its own dedicated
    prompt (a specialized 'handler'), rather than solving every sub-step with the same generic prompt
    the way Least-to-Most does.
  description: 'Shares Least-to-Most Prompting''s decomposition instinct but takes it further: instead
    of solving every decomposed subproblem with the same general-purpose few-shot prompt, Decomposed Prompting
    defines a distinct prompting strategy (a specialized sub-handler, potentially with its own exemplars,
    tool access, or even a different decomposition recursively) for each type of sub-task, coordinated
    by a top-level decomposer. This modularity means individual sub-task handlers can be debugged, improved,
    or swapped independently — closer to software decomposition into functions than to a single flat prompt.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Complex tasks that decompose into sub-tasks of genuinely different types (e.g. some retrieval-based,
    some computational, some requiring different exemplars) where a single generic sub-solving prompt
    would be a poor fit for all of them.
  when_not_to_use:
  - Tasks that decompose into homogeneous sub-steps — Least-to-Most's simpler single-prompt-reused-per-step
    approach is sufficient and less engineering overhead.
  known_pitfalls:
  - More complex to build and maintain than Least-to-Most, since each sub-task type needs its own handler
    design rather than reusing one prompt.
  related_techniques:
  - least-to-most-prompting
  - self-ask
  - plan-and-solve-prompting
  primary_source:
    authors: Khot, Trivedi, Finlayson, Fu, Richardson, Clark, Sabharwal
    year: 2022
    title: 'Decomposed Prompting: A Modular Approach for Solving Complex Tasks'
    venue: ICLR 2023
    arxiv_id: '2210.02406'
    url: https://arxiv.org/abs/2210.02406
  usage_templates:
  - template_name: Decomposer + specialized sub-handlers
    template: |-
      # Top-level decomposer
      Task: {{complex_task}}
      Decompose into sub-tasks, labeling each with the handler type needed: {{subtask_list_with_handler_types}}

      # Per sub-task, dispatch to its specialized handler
      Handler type: {{handler_type}}
      Handler-specific prompt/exemplars: {{handler_specific_prompt}}
      Sub-task input: {{subtask_input}}
      Sub-task output: {{subtask_output}}

      # Combine
      Using all sub-task outputs {{all_subtask_outputs}}, produce the final answer to: {{complex_task}}
    variables:
    - name: complex_task
      description: The overall task being decomposed
      example: null
    - name: subtask_list_with_handler_types
      description: Decomposed sub-tasks, each labeled with which handler type solves it
      example: null
    - name: handler_type
      description: Which specialized handler is being invoked
      example: null
    - name: handler_specific_prompt
      description: That handler's own dedicated prompt/exemplars
      example: null
    - name: subtask_input
      description: Input to this specific sub-task
      example: null
    - name: subtask_output
      description: Output from this sub-task's handler
      example: null
    - name: all_subtask_outputs
      description: Collected outputs from every sub-task handler
      example: null
    template_id: decomposed-prompting--decomposer-specialized-sub-handlers
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - decomposition
  - modular
  - multi-call
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: complexity-based-prompting
  name: Complexity-Based Prompting
  category: reasoning-elicitation
  subcategory: example-curation
  executive_summary: Select and vote using the most complex (most reasoning steps) chain-of-thought exemplars
    and generations — more steps in exemplars and in majority-voted outputs both correlate with better
    performance.
  description: 'Answers a specific version of the ''which exemplars make the best prompt'' question: rather
    than picking exemplars for coverage or clarity, Complexity-Based Prompting deliberately selects few-shot
    exemplars with more reasoning steps, finding this substantially outperforms shorter-chain exemplars
    on multi-step reasoning tasks. Extends the same complexity criterion from prompting (selecting inputs)
    to decoding (selecting outputs): when sampling multiple reasoning chains à la Self-Consistency, it
    votes using only the majority answer among the most complex generated chains rather than all sampled
    chains equally.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Multi-step reasoning tasks where an exemplar pool with varying reasoning-chain lengths is available
    to select from.
  - Combined with Self-Consistency-style sampling, to bias voting toward more thoroughly-reasoned generations.
  when_not_to_use:
  - Single-step or shallow-reasoning tasks where chain complexity isn't a meaningful signal to select
    or vote by.
  known_pitfalls:
  - Complexity (step count) is a proxy for reasoning quality, not a guarantee — a long chain can still
    be a long wrong chain.
  related_techniques:
  - chain-of-thought
  - self-consistency
  - active-prompting
  primary_source:
    authors: Fu, Peng, Sabharwal, Clark, Khot
    year: 2023
    title: Complexity-Based Prompting for Multi-Step Reasoning
    venue: ICLR 2023
    arxiv_id: '2210.00720'
    url: https://arxiv.org/abs/2210.00720
  usage_templates:
  - template_name: Complexity-selected exemplars and complexity-weighted voting
    template: |-
      # Exemplar selection (once, from an exemplar pool)
      From this pool of candidate exemplars {{exemplar_pool}}, select the {{num_exemplars}} exemplars with the most reasoning steps for the few-shot prompt.

      # Sample and complexity-weighted vote
      {{complex_few_shot_cot_prompt}}
      (sample {{num_samples}} generations at temperature {{temperature}})
      Among the generated chains, take the majority answer considering only the {{top_k_complex}} chains with the most reasoning steps, rather than all {{num_samples}} chains equally.
    variables:
    - name: exemplar_pool
      description: Pool of candidate exemplars with varying reasoning-chain lengths
      example: null
    - name: num_exemplars
      description: How many high-complexity exemplars to select for the prompt
      example: '8'
    - name: complex_few_shot_cot_prompt
      description: The assembled prompt using the selected high-complexity exemplars
      example: null
    - name: num_samples
      description: How many chains to sample
      example: '10'
    - name: temperature
      description: Sampling temperature
      example: '0.7'
    - name: top_k_complex
      description: How many of the most-complex sampled chains to vote among
      example: '5'
    template_id: complexity-based-prompting--complexity-selected-exemplars-and-complexity-weighted-voting
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
  - reasoning
  - example-selection
  - voting
  - multi-call
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: progressive-hint-prompting
  name: Progressive-Hint Prompting (PHP)
  category: reasoning-elicitation
  subcategory: iterative-refinement
  executive_summary: Feed the model's own previous answer back in as a hint for the next attempt, repeating
    across automatic rounds until the answer stabilizes — using prior outputs to progressively converge
    toward the correct one.
  description: 'Notes that plain CoT and Self-Consistency don''t fully exploit the answers a model already
    generated to guide subsequent responses — once an answer is produced, it''s typically discarded rather
    than fed back. PHP automates multiple rounds of interaction where each round''s prompt includes the
    previous round''s answer as a hint, progressively refining toward the correct answer, and stops when
    the answer stabilizes across rounds. Orthogonal to CoT and Self-Consistency (composes with both):
    reported +4.2% on GSM8K with greedy decoding over Complex CoT, and a 46% reduction in sampled paths
    needed when combined with self-consistency, plus new state-of-the-art results on SVAMP, GSM8K, AQuA,
    and MATH when combined with GPT-4.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Multi-step reasoning/math tasks where iterating on a first-pass answer with the answer itself as context
    is likely to converge toward a more accurate one.
  - Combined with Self-Consistency, specifically to reduce the number of sampled paths needed for the
    same accuracy.
  when_not_to_use:
  - Tasks with no natural 'hint the next attempt with the last answer' structure — open-ended generation
    without a stabilizing target.
  known_pitfalls:
  - Needs a stopping rule (answer stability across rounds, or a round budget) to avoid unbounded iteration;
    if the model oscillates between two answers rather than converging, iteration can continue without
    benefit.
  related_techniques:
  - chain-of-thought
  - self-consistency
  - self-refine
  primary_source:
    authors: Zheng, Liu, Xie, Li, Li
    year: 2023
    title: Progressive-Hint Prompting Improves Reasoning in Large Language Models
    venue: arXiv preprint
    arxiv_id: '2304.09797'
    url: https://arxiv.org/abs/2304.09797
  usage_templates:
  - template_name: Iterate-with-previous-answer-as-hint
    template: |-
      # Round 1
      {{question}}
      Let's think step by step.
      (produces {{answer_round_1}})

      # Round r>1 (repeat, feeding the previous answer back as a hint)
      {{question}}
      Hint: the answer is near {{previous_round_answer}}.
      Let's think step by step.
      (produces {{answer_round_r}})

      # Stop when {{answer_round_r}} == {{previous_round_answer}} (stabilized) or the round budget {{max_rounds}} is reached; return the stabilized answer.
    variables:
    - name: question
      description: The question being iteratively refined toward
      example: null
    - name: answer_round_1
      description: First-round answer, with no hint
      example: null
    - name: previous_round_answer
      description: The answer from the immediately preceding round, fed back as a hint
      example: null
    - name: answer_round_r
      description: This round's answer
      example: null
    - name: max_rounds
      description: Round budget cutoff if the answer never stabilizes
      example: '5'
    template_id: progressive-hint-prompting--iterate-with-previous-answer-as-hint
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
  - reasoning
  - iterative
  - multi-call
  - self-hinting
  status: verified-external
  aliases:
  - PHP
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: zero-shot-prompting
  name: Zero-Shot Prompting
  category: reasoning-elicitation
  subcategory: foundational
  executive_summary: Instruct the model to perform a task directly, with no worked examples at all — relying
    entirely on what the model learned during pretraining/instruction-tuning to interpret and execute
    the instruction correctly.
  description: 'The default, simplest mode of interacting with an instruction-tuned LLM: state the task
    and let the model respond, with no demonstrations of input/output pairs. Foundational to the whole
    field — demonstrated at meaningful scale by GPT-2''s ability to perform tasks (summarization, translation,
    reading comprehension) it was never explicitly trained for, purely from a natural-language instruction,
    and every other technique in this catalog is either a variant of zero-shot (Zero-Shot-CoT adds a trigger
    phrase), a departure from it (Few-Shot adds exemplars), or built on top of it (nearly everything else).
    Effective when the task is common enough, or clearly enough specified, that the model doesn''t need
    worked examples to infer the expected input/output mapping.'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Common, well-specified tasks (classification, straightforward summarization, translation, simple formatting)
    where the instruction alone is enough to convey what's expected.
  - As the cheapest possible baseline before reaching for any more elaborate technique in this catalog.
  when_not_to_use:
  - Tasks with an idiosyncratic or unusual expected output format/style that the instruction alone doesn't
    convey — Few-Shot Prompting communicates this more reliably via demonstration.
  - Multi-step reasoning tasks where the model benefits from seeing intermediate steps — see Zero-Shot-CoT
    or Chain-of-Thought instead.
  known_pitfalls:
  - No mechanism to correct a misunderstanding of the task — if the model infers the wrong interpretation
    of an ambiguous instruction, there's no exemplar to anchor it, unlike Few-Shot Prompting.
  related_techniques:
  - few-shot-prompting
  - zero-shot-cot
  - chain-of-thought
  primary_source:
    authors: Radford, Wu, Child, Luan, Amodei, Sutskever
    year: 2019
    title: Language Models are Unsupervised Multitask Learners
    venue: OpenAI (technical report)
    arxiv_id: null
    url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
  usage_templates:
  - template_name: Direct instruction, no exemplars
    template: |-
      {{task_instruction}}

      {{input_content}}
    variables:
    - name: task_instruction
      description: A clear, direct statement of the task to perform
      example: Classify the sentiment of the following review as Positive, Negative, or Neutral.
    - name: input_content
      description: The actual content the task is performed on
      example: null
    template_id: zero-shot-prompting--direct-instruction-no-exemplars
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - zero-shot
  - foundational
  - single-call
  - low-cost
  status: verified-external
  aliases: []
  secondary_sources:
  - authors: Brown, Mann, Ryder, Subbiah, Kaplan, Dhariwal, Neelakantan, Shyam, Sastry, Askell, et al.
    year: 2020
    title: Language Models are Few-Shot Learners
    venue: NeurIPS 2020
    arxiv_id: '2005.14165'
    url: https://arxiv.org/abs/2005.14165
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: few-shot-prompting
  name: Few-Shot Prompting
  category: reasoning-elicitation
  subcategory: foundational
  executive_summary: Show the model a handful of input/output demonstration pairs before the real query,
    so it infers the task's expected pattern from examples alone — no gradient updates, no fine-tuning,
    purely in-context.
  description: 'The foundational in-context-learning result: GPT-3 demonstrated that a sufficiently large
    language model can perform a new task competitively just from seeing a handful of demonstrations in
    its context window, without any parameter updates — a qualitatively different capability from the
    fine-tuning-per-task paradigm that preceded it. Distinct from Chain-of-Thought''s few-shot variant
    specifically: plain Few-Shot Prompting demonstrates the input-to-output mapping directly (no intermediate
    reasoning shown), which is exactly what CoT few-shot exemplars add on top of. This is the general
    in-context-learning mechanism nearly every exemplar-based technique in this catalog (CoT, Contrastive
    CoT, Analogical Prompting, and more) specializes or extends.'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Tasks with an output format, style, or convention that's hard to fully specify in an instruction but
    easy to demonstrate (e.g. a specific JSON schema, a particular tone, an unusual classification scheme).
  - No labeled training set or fine-tuning budget is available, but a handful of hand-picked examples
    are.
  when_not_to_use:
  - The task is simple/common enough that Zero-Shot Prompting already performs reliably — exemplars add
    token cost without benefit.
  - Multi-step reasoning tasks — plain input/output exemplars don't show the reasoning process; see Chain-of-Thought
    instead.
  known_pitfalls:
  - Sensitive to exemplar selection, ordering, and formatting — see Calibrate Before Use and Fantastically
    Ordered Prompts elsewhere in this catalog for documented failure modes and mitigations specific to
    this sensitivity.
  - Uses meaningfully more tokens than zero-shot, scaling with exemplar count.
  related_techniques:
  - zero-shot-prompting
  - chain-of-thought
  - what-makes-good-in-context-examples
  - calibrate-before-use
  primary_source:
    authors: Brown, Mann, Ryder, Subbiah, Kaplan, Dhariwal, Neelakantan, Shyam, Sastry, Askell, et al.
    year: 2020
    title: Language Models are Few-Shot Learners
    venue: NeurIPS 2020
    arxiv_id: '2005.14165'
    url: https://arxiv.org/abs/2005.14165
  usage_templates:
  - template_name: Input/output demonstration pairs
    template: |-
      {{task_instruction}}

      Input: {{example_input_1}}
      Output: {{example_output_1}}

      Input: {{example_input_2}}
      Output: {{example_output_2}}

      Input: {{target_input}}
      Output:
    variables:
    - name: task_instruction
      description: Brief statement of the task (optional if the pattern is clear from exemplars alone)
      example: null
    - name: example_input_1
      description: First demonstration's input
      example: null
    - name: example_output_1
      description: First demonstration's corresponding output
      example: null
    - name: example_input_2
      description: Second demonstration's input
      example: null
    - name: example_output_2
      description: Second demonstration's corresponding output
      example: null
    - name: target_input
      description: The actual input to produce an output for
      example: null
    template_id: few-shot-prompting--input-output-demonstration-pairs
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - few-shot
  - foundational
  - in-context-learning
  - single-call
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: pal-program-aided-language-models
  name: PAL (Program-Aided Language Models)
  category: reasoning-elicitation
  subcategory: tool-offloaded-reasoning
  executive_summary: Have the LLM read a natural-language problem and generate a program as the reasoning
    artifact, then offload solving to a runtime (e.g. Python) rather than having the LLM compute the answer
    itself in free text.
  description: Concurrent and near-identical in core idea to Program-of-Thoughts (already in this catalog,
    published within weeks of each other in late 2022 by different author teams) — both separate 'what
    to compute' (generated by the LLM as code) from 'computing it' (delegated to a real interpreter),
    removing arithmetic-simulation errors that plain CoT is prone to. PAL specifically emphasizes framing
    the LLM's role as translating a natural-language problem into a program using intermediate variables,
    with the interpreter's execution of that program treated as the final reasoning step rather than something
    the LLM narrates. Frequently cited alongside PoT as the two foundational papers establishing code-generation-as-reasoning;
    kept as a separate catalog entry from PoT given both are independently and heavily cited as distinct
    primary sources in the literature, even though the mechanism is nearly identical.
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - The task is fundamentally computational (arithmetic, symbolic manipulation, date/logic puzzles) and
    a code interpreter is available at inference time.
  - Citing the specific PAL paper matters for the context (e.g. reproducing a paper's baseline) rather
    than Program-of-Thoughts.
  when_not_to_use:
  - No code execution sandbox is available.
  - The task isn't computational — code generation is pure overhead for qualitative reasoning.
  known_pitfalls:
  - 'Shares Program-of-Thoughts'' limitation: eliminates arithmetic-simulation errors specifically, not
    reasoning errors in the program''s logic itself.'
  related_techniques:
  - program-of-thoughts
  - chain-of-thought
  - art-automatic-reasoning-tool-use
  primary_source:
    authors: Gao, Madaan, Zhou, Alon, Liu, Yang, Callan, Neubig
    year: 2023
    title: 'PAL: Program-Aided Language Models'
    venue: ICML 2023
    arxiv_id: '2211.10435'
    url: https://arxiv.org/abs/2211.10435
  usage_templates:
  - template_name: Natural-language-to-program translation
    template: |-
      {{problem}}
      # Let's write a Python program to solve this, using intermediate variables that mirror the problem's quantities.
      ```python
      # your program here, ending with a variable holding the final answer
      ```
      # The program is then executed by a Python interpreter to obtain the answer.
    variables:
    - name: problem
      description: The natural-language computational problem
      example: null
    template_id: pal-program-aided-language-models--natural-language-to-program-translation
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - reasoning
  - code-execution
  - numerical
  - single-call
  status: verified-external
  aliases:
  - PAL
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: system-2-attention
  name: System 2 Attention (S2A)
  category: reasoning-elicitation
  subcategory: context-filtering
  executive_summary: Have the model rewrite the input context, stripping irrelevant or biasing material,
    then reason only over the cleaned version — filtering before reasoning rather than reasoning over
    the raw, misleading context.
  description: 'Named as an analogy to Kahneman''s System 1 (fast, automatic) versus System 2 (slow, deliberate)
    distinction: standard transformer attention is fundamentally System-1-like, since irrelevant or biasing
    context can still influence the soft attention distribution over all tokens even when the model ''knows
    better''. S2A adds an explicit, deliberate step: prompt the model to regenerate the context, keeping
    only the parts relevant and unbiased for the task, then run the actual reasoning/response generation
    over that regenerated context instead of the original. Demonstrated improving factuality and objectivity
    on tasks specifically designed to contain distracting opinions or irrelevant context, and reducing
    sycophancy (agreeing with a stated opinion embedded in the prompt rather than reasoning independently).'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - User-supplied context that may contain irrelevant details, stated opinions, or leading framing that
    could bias the model's response away from an objective answer.
  - Tasks specifically vulnerable to sycophancy, where the prompt itself hints at an expected answer.
  when_not_to_use:
  - Clean, already-relevant context with no plausible source of bias or irrelevant distraction — the filtering
    step is pure overhead.
  - Tasks where the 'irrelevant' details are actually load-bearing in a way a filtering pass might strip
    out incorrectly.
  known_pitfalls:
  - The filtering step itself is a judgment call by the model — it can strip content that seemed irrelevant
    but wasn't, same class of risk as any context-rewriting technique.
  related_techniques:
  - thread-of-thought
  - rephrase-and-respond
  - problem-elaboration-prompting
