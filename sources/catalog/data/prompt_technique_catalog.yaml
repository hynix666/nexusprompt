  - Designing or documenting a reusable library of prompt structures for a team or project, especially
    one that wants patterns to be composable.
  when_not_to_use:
  - A single one-off prompt with no reuse or documentation need.
  known_pitfalls:
  - A catalog is only as useful as its currency — patterns catalogued against one prompting era can go
