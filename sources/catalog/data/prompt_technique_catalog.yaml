- id: recomp
  name: RECOMP
  category: prompt-compression-context-engineering
  subcategory: trained-compression
  executive_summary: Trained extractive and abstractive compressor models specifically designed for prompt
    compression. Learns to compress retrieved documents into concise summaries that preserve query-relevant
    information.
  description: 'RECOMP trains dedicated compressor models (separate from the generator LLM) to compress
    retrieved documents. It supports two modes: (1) Extractive — selecting the most important sentences
    from retrieved text, and (2) Abstractive — generating novel summaries of retrieved text. Both modes
    are trained with a distillation objective that ensures the compressed text preserves the information
    needed to answer queries correctly.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - High-volume RAG systems where prompt compression is a bottleneck.
  - When you can afford to train a specialized compressor.
  - When retrieved documents are long and contain significant redundancy.
  when_not_to_use:
  - When training data for the compressor is unavailable.
  - When the overhead of running a separate compressor model is unacceptable.
  - When retrieval quality is already high and documents are short.
  known_pitfalls:
  - Compressor training requires labeled query-document-answer triples.
  - Extractive mode may miss cross-sentence information.
  - Abstractive mode may hallucinate during compression.
  related_techniques:
  - llmlingua-prompt-compression
  - longllmlingua
  - selective-context
