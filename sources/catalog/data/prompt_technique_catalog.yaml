    template: |-
      SGLang Program:
      {{sglang_program}}

      Example:
      @sgl.function
      def extract_info(s, text):
          s += "Text: " + text + "\n"
          s += "Name: " + sgl.gen("name", regex=r"[A-Z][a-z]+") + "\n"
