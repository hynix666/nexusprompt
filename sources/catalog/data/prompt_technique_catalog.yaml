  usage_templates:
  - template_name: Multi-sample consistency check
    template: |-
      Sample {{n}} answers to the following question at temperature {{temperature}}:
      {{question}}

      If the answers are consistent → likely grounded.
      If they contradict → likely hallucinated.
      Flag inconsistent claims for review.
    variables:
    - name: n
      description: Number of samples to generate.
      example: '5'
    - name: temperature
      description: Sampling temperature for diversity.
      example: '0.8'
    - name: question
      description: The question to sample multiple answers for.
      example: Who invented the telephone?
    template_id: selfcheckgpt--multi-sample
    determinism: stochastic-by-design
    reproducibility_note: Requires N independent samples at temperature > 0. Consistency can be measured
      via n-gram overlap, BERTScore, or LLM-as-judge.
