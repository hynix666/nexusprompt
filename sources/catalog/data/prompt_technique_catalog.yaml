- id: opro
  name: Large Language Models as Optimizers (OPRO)
  category: automatic-prompt-optimization
  subcategory: general-purpose-optimizer
  executive_summary: 'Frame the LLM itself as a general-purpose optimizer: describe past solutions and
    scores in natural language and ask it to propose a better one — applicable to prompt optimization
    among other tasks.'
  description: 'Rather than a prompt-specific search procedure, OPRO poses optimization as a meta-prompting
    loop: the model is shown the problem description, previously tried solutions and their scores (in
    this application, previously tried prompts and their accuracy), and asked to propose a new solution
    expected to score higher. Iterating this loop is a general ''LLM-as-optimizer'' pattern, of which
    prompt optimization is one instance among several tested in the paper.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Any optimization problem — including but not limited to prompt text — where solutions and their scores
    can be expressed compactly in natural language for the model to read as a trajectory.
  when_not_to_use:
  - The scoring function is expensive enough that many optimization rounds are infeasible.
  known_pitfalls:
  - Performance is sensitive to how the optimization trajectory (past solutions + scores) is formatted
    in the meta-prompt.
  related_techniques:
  - automatic-prompt-engineer
  - automatic-prompt-optimization-gradient-beam
  - promptbreeder
  primary_source:
    authors: Yang, Wang, Lin, Lee, Ren, Liu, Wang, Chen, Zhou
