- id: found-in-the-middle-calibration
  name: Found-in-the-Middle Positional Calibration
  category: example-selection-formatting
  subcategory: context-positioning
  executive_summary: Measure a model's intrinsic U-shaped positional attention bias, then apply calibration
    that reweights attention so relevance — not position — determines what gets attended to, recovering
    middle-of-context performance.
  description: 'Where Lost in the Middle (already in this catalog) documents the U-shaped positional-attention
    phenomenon empirically, this is the technique-level answer: establish the causal connection between
    the lost-in-the-middle effect and the model''s intrinsic attention bias (tokens at the start and end
    of input get disproportionately more attention regardless of actual relevance), then apply a calibration
    mechanism that corrects for that bias so attention tracks relevance instead of position, even for
    content genuinely in the middle. Reports both better performance at locating relevant information
    within long contexts and downstream improvements in retrieval-augmented generation across tasks, without
    needing to change the model''s architecture.'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Long-context or RAG deployments where relevant content frequently ends up in the middle of the context
    window (e.g. concatenated retrieved passages) and simply repositioning content (Lost in the Middle's
    mitigation) isn't sufficient or practical.
  when_not_to_use:
  - Short contexts where positional attention bias isn't a measurable factor, or deployments where content
    can always be reliably placed at the start/end instead.
  known_pitfalls:
  - Calibration is a correction applied at inference time based on measured bias patterns; it addresses
    positional bias specifically, not unrelated causes of retrieval or reasoning failure.
  related_techniques:
  - lost-in-the-middle
  - thread-of-thought
  - retrieval-augmented-generation
  primary_source:
    authors: Hsieh, Chuang, Li, Wang, Le, Kumar, Glass, Ratner, Krishna, Lee, Pfister
    year: 2024
    title: 'Found in the Middle: Calibrating Positional Attention Bias Improves Long Context Utilization'
    venue: Findings of ACL 2024
    arxiv_id: '2406.16008'
    url: https://arxiv.org/abs/2406.16008
  usage_templates:
  - template_name: Measure-then-calibrate positional attention
    template: |-
      # Measure (once per model/deployment)
      Run controlled probes placing a known-relevant fact at each position across a long context; record the U-shaped attention/accuracy curve as a function of position: {{measured_positional_bias_curve}}

      # Calibrate
      Apply an attention reweighting derived from {{measured_positional_bias_curve}} that flattens the positional bias, so attention at inference time tracks content relevance rather than position.

      # Deploy
      {{long_context}}
      Question: {{question}}
      (answered using the calibrated model, which no longer systematically under-attends to middle-positioned content)
    variables:
    - name: measured_positional_bias_curve
      description: The empirically measured attention-vs-position bias for this model
      example: null
    - name: long_context
      description: The long context being queried at deployment time
      example: null
    - name: question
      description: The question being asked over the long context
      example: null
    template_id: found-in-the-middle-calibration--measure-then-calibrate-positional-attention
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reliability
  - long-context
  - positioning
  - calibration
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: prompt-repetition
  name: Prompt Repetition
  category: example-selection-formatting
  subcategory: context-positioning
  executive_summary: Simply duplicate the entire prompt back-to-back so left-to-right attention can reach
    information that only appeared later — improving accuracy on non-reasoning tasks for most models with
    no added output length.
  description: 'Addresses the same causal-masking root cause as Lost in the Middle and Found-in-the-Middle
    Calibration, but with the simplest possible mitigation: standard decoder-only LLMs process text left-to-right,
    so a token early in the prompt (e.g. answer options listed before the passage they refer to) cannot
    attend to content that appears after it in a single pass. Repeating the full prompt verbatim means
    every token''s second occurrence can now attend to the entire first occurrence, approximating bidirectional
    attention without any architecture change. Tested across 7 models (Gemini 2.0 Flash/Flash Lite, GPT-4o/4o-mini,
    Claude 3 Haiku/3.7 Sonnet, DeepSeek V3) and 7 benchmarks (ARC-Challenge, OpenBookQA, GSM8K, MMLU-Pro,
    MATH, plus two custom positional-sensitivity benchmarks) on non-reasoning generation: repetition won
    47/70 model-benchmark combinations with 0 losses (statistically significant by McNemar''s test), including
    gains up to 76% on some retrieval/lookup tasks, with no increase in output length and no added latency
    for most models tested — the paper notes Anthropic''s Claude models as the exception to the latency-neutrality
    claim. In reasoning-enabled mode the benefit is much smaller (reported as 5 wins vs. 22 ties in that
    setting), consistent with the paper''s own observation that RL-trained reasoning models often already
    learn to repeat parts of the request on their own.'
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Non-reasoning generation (direct answers, classification, retrieval/lookup from a provided passage,
    multiple-choice) where cost and latency matter and a free, single-call formatting change is preferred
    over more expensive techniques.
  - Cases resembling 'Lost in the Middle' symptoms — answer options or instructions appearing before the
    content they depend on.
  when_not_to_use:
  - Reasoning-enabled generation (explicit chain-of-thought or 'thinking' modes) — reported benefit there
    was much weaker (5 wins vs. 22 ties across the same test matrix), consistent with reasoning models
    often already exhibiting similar re-reading behavior on their own.
  - Tasks where doubling the input token count meaningfully affects cost under a strict prompt-token budget,
    even though output length is unaffected.
  - Deployments on Claude models specifically where added latency from the longer input hasn't been separately
    verified — the paper notes Claude as the exception to its general latency-neutrality finding.
  known_pitfalls:
  - The underlying experiments were run against model versions current as of early-to-mid 2025 (Gemini
    2.0, GPT-4o family, Claude 3.x, DeepSeek V3) — later model generations released since are untested,
    so the specific magnitude of reported gains (up to 76% on some tasks) should be treated as demonstrated
    on that model generation, not guaranteed to hold identically on newer ones, even though the underlying
    causal-masking mechanism the technique addresses is architecture-level and plausibly still applies.
  - The 'no added latency' finding has a noted exception for Anthropic's Claude models specifically —
    verify latency impact empirically before assuming it's free on every provider.
  - This is a December 2025 preprint, not yet peer-reviewed at time of cataloging — the experimental design
    (7 models, 70 combinations, McNemar significance testing) is solid, but independent replication by
    other labs hadn't been found as of this entry's most recent check.
  related_techniques:
  - lost-in-the-middle
  - found-in-the-middle-calibration
  - thread-of-thought
  primary_source:
    authors: Leviathan, Kalman, Matias
    year: 2025
    title: Prompt Repetition Improves Non-Reasoning LLMs
    venue: arXiv preprint (Google Research)
    arxiv_id: '2512.14982'
    url: https://arxiv.org/abs/2512.14982
  usage_templates:
  - template_name: Duplicate the full prompt verbatim
    template: |-
      {{original_prompt}}
      {{original_prompt}}
    variables:
    - name: original_prompt
      description: The complete original prompt (instructions, context, question), repeated verbatim immediately
        after itself with no separator needed
      example: null
    template_id: prompt-repetition--duplicate-the-full-prompt-verbatim
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reliability
  - long-context
  - positioning
  - single-call
  - low-cost
  - recent
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: prompt-pattern-catalog
  name: Prompt Pattern Catalog (Design-Pattern Framing)
  category: template-pattern-scaffolding
  subcategory: pattern-catalog
  executive_summary: Document reusable prompt structures as software design patterns — each with a stated
    problem, context, and solution — rather than as one-off examples.
  description: Applies the software-engineering design-pattern format (problem/context/solution/consequences)
    to prompt engineering, cataloging patterns such as the 'Persona Pattern', 'Template Pattern', 'Recipe
    Pattern', and others, with explicit guidance on composing multiple patterns in a single prompt. This
    is the closest existing academic precedent to building and maintaining a structured, checkable technique
    catalog.
