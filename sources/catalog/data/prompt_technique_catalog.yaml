    description: verified-against-abstract
    pitfalls: unverified
- id: calibrate-before-use
  name: Calibrate Before Use
  category: example-selection-formatting
  subcategory: output-bias-correction
  executive_summary: Correct for a model's baseline bias toward certain answers (caused by prompt format,
    example choice, and example order) before trusting its predictions, recovering large accuracy swings.
  description: Estimates the model's output distribution on a content-free or trivial input (e.g. an empty
    test input) to measure its baseline bias toward particular labels, then uses that estimate to calibrate
    (reweight) the model's actual predictions. Demonstrates that few-shot accuracy on an identical task
    can swing from near-chance to near-state-of-the-art purely from prompt format, example selection,
    and example order — calibration recovers much of that variance without changing the prompt itself.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Few-shot classification-style tasks where label bias from prompt format/ordering is a plausible confound.
  when_not_to_use:
  - Open-ended generation tasks with no fixed label set to calibrate over.
  known_pitfalls:
  - Calibration corrects for measured bias on a specific baseline query; it does not fix an underlying
    reasoning error the model would make even under a corrected label prior.
  related_techniques:
  - fantastically-ordered-prompts
  - what-makes-good-in-context-examples
  primary_source:
    authors: Zhao, Wallace, Feng, Klein, Singh
    year: 2021
    title: 'Calibrate Before Use: Improving Few-Shot Performance of Language Models'
    venue: ICML 2021
    arxiv_id: '2102.09690'
    url: https://arxiv.org/abs/2102.09690
  usage_templates:
  - template_name: Content-free calibration
    template: |-
      # Step 1 — measure bias
      {{few_shot_prompt_prefix}}
      Input: {{content_free_placeholder}}
      Output:
      (record the output distribution p_cf over labels: {{label_set}})

      # Step 2 — calibrate real predictions
      {{few_shot_prompt_prefix}}
      Input: {{real_input}}
      Output:
      (record raw distribution p_raw; final calibrated prediction = argmax over label of p_raw[label] / p_cf[label])
    variables:
    - name: few_shot_prompt_prefix
      description: The shared few-shot exemplar prefix being evaluated
      example: null
    - name: content_free_placeholder
      description: A null/empty/placeholder input, e.g. 'N/A' or empty string
      example: N/A
    - name: label_set
      description: The fixed set of possible output labels
      example: null
    - name: real_input
      description: An actual input to classify
      example: null
    template_id: calibrate-before-use--content-free-calibration
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
