- id: branch-solve-merge
  name: Branch-Solve-Merge (BSM)
  category: self-verification-refinement
  subcategory: bias-reduction
  executive_summary: Reduces positional bias and length bias in evaluation by decomposing criteria into
    parallel sub-criteria, evaluating each independently, and merging results via consensus.
  description: 'BSM addresses evaluation biases (positional bias — favoring first/last options; length
    bias — favoring longer/shorter responses) by: (1) Branching — decomposing the evaluation into multiple
    independent sub-criteria, (2) Solving — evaluating each sub-criterion separately, and (3) Merging
    — aggregating sub-criterion scores into a final judgment. This parallel structure dilutes the impact
    of any single bias dimension.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Evaluation tasks where positional or length bias is suspected.
  - LLM-as-judge scenarios requiring fair comparison.
  - Ranking or scoring multiple candidate outputs.
  when_not_to_use:
  - When evaluation criteria cannot be decomposed into independent sub-criteria.
  - When the cost of multiple parallel evaluations is prohibitive.
  - Simple binary classification where bias is not a concern.
  known_pitfalls:
  - Sub-criterion decomposition quality affects final judgment.
  - Merging strategy (average, weighted, consensus) must be chosen carefully.
  - Does not eliminate all biases, only reduces their impact.
  related_techniques:
