techniques:
- id: chain-of-thought
  name: Chain-of-Thought (CoT) Prompting
  category: reasoning-elicitation
  subcategory: single-path-reasoning
  executive_summary: Prompt the model with worked examples that show step-by-step reasoning, so it reasons
    in steps before answering instead of jumping straight to a conclusion.
  description: Few-shot exemplars that include intermediate reasoning steps, not just final answers, are
    shown before the target question. The model learns from the pattern to produce its own intermediate
    steps, which substantially improves performance on multi-step arithmetic, commonsense, and symbolic
    reasoning tasks. It is the foundation nearly every later reasoning-elicitation technique builds on
    or varies.
  verification_status: judge-checkable
  cost_profile: single-call
  when_to_use:
  - The task requires more than one logical or arithmetic step to reach a correct answer.
  - You have or can write 2-8 worked examples in the target domain.
  when_not_to_use:
  - The task is a single lookup or classification with no multi-step structure — CoT adds tokens without
    adding accuracy.
  - Model is small enough that CoT exemplars don't reliably improve over direct answering (an empirically
    observed emergent-capability threshold).
  known_pitfalls:
  - A plausible-looking chain does not guarantee a correct answer; the model can rationalize a wrong answer
    just as fluently as a right one.
  - Long chains increase token cost roughly linearly without a matching accuracy gain past a task-dependent
    point.
  related_techniques:
  - zero-shot-cot
  - self-consistency
  - tree-of-thoughts
  - least-to-most-prompting
  primary_source:
    authors: Wei, Wang, Schuurmans, Bosma, Ichter, Xia, Chi, Le, Zhou
    year: 2022
    title: Chain-of-Thought Prompting Elicits Reasoning in Large Language Models
    venue: NeurIPS 2022
    arxiv_id: '2201.11903'
    url: https://arxiv.org/abs/2201.11903
  usage_templates:
  - template_name: Few-shot CoT exemplar block
    template: |-
      Q: {{example_question_1}}
      A: {{example_stepwise_reasoning_1}} So the answer is {{example_answer_1}}.

      Q: {{example_question_2}}
      A: {{example_stepwise_reasoning_2}} So the answer is {{example_answer_2}}.

      Q: {{target_question}}
      A:
    variables:
    - name: example_question_1
      description: First worked example's question
      example: Roger has 5 tennis balls. He buys 2 cans of 3 balls each. How many does he have now?
    - name: example_stepwise_reasoning_1
      description: The worked step-by-step reasoning for example 1
      example: Roger started with 5 balls. 2 cans of 3 balls each is 6 balls. 5 + 6 = 11.
    - name: example_answer_1
      description: Final answer for example 1
      example: '11'
    - name: example_question_2
      description: Second worked example's question
      example: null
    - name: example_stepwise_reasoning_2
      description: Worked reasoning for example 2
      example: null
    - name: example_answer_2
      description: Final answer for example 2
      example: null
    - name: target_question
      description: The actual question to answer
      example: null
    template_id: chain-of-thought--few-shot-cot-exemplar-block
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - few-shot
  - foundational
  status: corpus-present
  aliases:
  - CoT
  secondary_sources: []
  corpus_file: Chain-of-Thought.pdf
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: zero-shot-cot
  name: Zero-Shot Chain-of-Thought
  category: reasoning-elicitation
  subcategory: single-path-reasoning
  executive_summary: Trigger step-by-step reasoning with a single generic phrase like 'Let's think step
    by step' — no worked examples required at all.
  description: Appends a fixed trigger sentence after the question, before generation, then (in the two-stage
    version) extracts the final answer with a second short prompt. Recovers most of the benefit of few-shot
    CoT without needing hand-written exemplars, making it far cheaper to deploy across new task types.
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - You need reasoning-elicitation on a task type with no existing worked examples.
  - You want a fast baseline to compare more elaborate reasoning techniques against.
  when_not_to_use:
  - Task-specific few-shot CoT exemplars are already available and cheap to include — they generally outperform
    the generic trigger.
  known_pitfalls:
  - Gains are smaller than few-shot CoT on tasks with idiosyncratic reasoning structure the generic trigger
    doesn't match.
  related_techniques:
  - chain-of-thought
  - self-consistency
  primary_source:
    authors: Kojima, Gu, Reid, Matsuo, Iwasawa
    year: 2022
    title: Large Language Models are Zero-Shot Reasoners
    venue: NeurIPS 2022
    arxiv_id: '2205.11916'
    url: https://arxiv.org/abs/2205.11916
  usage_templates:
  - template_name: Two-stage zero-shot trigger
    template: |-
      {{question}}
      Let's think step by step.

      --- (generate reasoning, then in a second call) ---
      {{question}}
      {{generated_reasoning}}
      Therefore, the answer is
    variables:
    - name: question
      description: The task question, unmodified
      example: null
    - name: generated_reasoning
      description: Output from the first-stage call, fed back in
      example: null
    template_id: zero-shot-cot--two-stage-zero-shot-trigger
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - zero-shot
  - foundational
  - low-cost
  status: corpus-present
  aliases:
  - Zero-Shot-CoT
  - Let's think step by step
  secondary_sources: []
  corpus_file: Zero-Shot Reasoners v4.pdf
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: emotionprompt
  name: EmotionPrompt (Psychology-Inspired Emotional Stimulus)
  category: reasoning-elicitation
  subcategory: single-path-reasoning
  executive_summary: Append a short, psychology-derived emotional-stimulus sentence to an unchanged zero-shot
    prompt — a near-zero-cost addition shown to outperform plain zero-shot and Zero-Shot-CoT baselines
    across tasks and models.
  description: Grounded in established psychology theory (social identity theory, social cognition theory)
    rather than ad hoc phrasing, EmotionPrompt appends one of a small set of tested emotional-stimulus
    sentences to a prompt, using the same underlying task template otherwise unchanged. Evaluated against
    plain zero-shot and Zero-Shot-CoT baselines across 8 tasks and multiple models (ChatGPT, Vicuna-13b,
    Bloom, T5), with reported improvements in truthfulness and informativeness as well as raw performance,
    and a human study reporting a 10.9% average improvement across performance, truthfulness, and responsibility
    metrics. Notable as one of the cheapest interventions in this catalog — a single appended sentence,
    no additional calls, no exemplars, no fine-tuning.
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - As a near-free addition to an existing zero-shot or Zero-Shot-CoT prompt when squeezing out additional
    performance is worth testing, given the marginal cost is close to zero.
  - Generative tasks where truthfulness/informativeness, not just raw accuracy, matters.
  when_not_to_use:
  - Tasks where prompt tone must remain strictly neutral/formal for domain reasons (e.g. some regulated
    or clinical contexts) — the emotional framing may be inappropriate regardless of any performance gain.
  - As a substitute for more substantive reasoning-elicitation techniques when the task genuinely needs
    multi-step decomposition — this is a low-cost add-on, not a replacement for chain-of-thought or self-consistency.
  known_pitfalls:
  - Effect size and which specific stimulus sentence works best is somewhat model- and task-dependent;
    the paper tests a fixed small set of stimuli rather than claiming any emotional framing helps.
  related_techniques:
  - zero-shot-cot
  - chain-of-thought
  primary_source:
    authors: Li, Wang, Zhang, Zhu, Hou, Lian, Luo, Yang, Xie
    year: 2023
    title: Large Language Models Understand and Can be Enhanced by Emotional Stimuli
    venue: arXiv preprint
    arxiv_id: '2307.11760'
    url: https://arxiv.org/abs/2307.11760
  usage_templates:
  - template_name: Emotional-stimulus appendix
    template: |-
      {{base_zero_shot_prompt}}
      {{emotional_stimulus_sentence}}
    variables:
    - name: base_zero_shot_prompt
      description: The unmodified underlying zero-shot (or Zero-Shot-CoT) prompt
      example: null
    - name: emotional_stimulus_sentence
      description: A tested psychology-derived stimulus sentence appended after the task prompt
      example: This is very important to my career. You'd better be sure.
    template_id: emotionprompt--emotional-stimulus-appendix
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - reasoning
  - zero-shot
  - low-cost
  - psychology
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: self-consistency
  name: Self-Consistency
  category: reasoning-elicitation
  subcategory: multi-path-reasoning
  executive_summary: Sample several independent reasoning paths for the same question, then take the most
    common final answer instead of trusting any single chain.
  description: Replaces greedy single-path decoding with temperature sampling of multiple diverse CoT
    reasoning paths, then marginalizes over them by majority vote on the final answer. Because wrong reasoning
    paths tend to disagree with each other while correct ones tend to converge, voting recovers accuracy
    that any individual sampled chain would miss. It is the standard baseline any more elaborate multi-call
    reasoning technique should be measured against.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - The task has a clear extractable final answer that can be compared for exact or near-exact match across
    samples.
  - You can afford k>=5 sampled completions per question.
  when_not_to_use:
  - Open-ended generation with no well-defined 'same answer' equivalence class to vote over.
  - Latency-critical single-call settings.
  known_pitfalls:
  - Cost scales linearly with sample count k; diminishing returns typically appear well before k=40.
  related_techniques:
  - chain-of-thought
  - tree-of-thoughts
  - skeleton-of-thought
  primary_source:
    authors: Wang, Wei, Schuurmans, Le, Chi, Narang, Chowdhery, Zhou
    year: 2023
    title: Self-Consistency Improves Chain of Thought Reasoning in Language Models
    venue: ICLR 2023
    arxiv_id: '2203.11171'
    url: https://arxiv.org/abs/2203.11171
  usage_templates:
  - template_name: Sample-and-vote harness
    template: |-
      # Repeat N={{num_samples}} times at temperature={{temperature}}:
      {{cot_prompt}}

      # Then:
      Extract the final answer from each of the {{num_samples}} completions and return the most frequent one. On ties, prefer the answer from the completion with the shortest reasoning chain.
    variables:
    - name: num_samples
      description: How many independent chains to sample
      example: '10'
    - name: temperature
      description: Sampling temperature (nonzero, for diversity)
      example: '0.7'
    - name: cot_prompt
      description: The underlying CoT or Zero-Shot-CoT prompt to sample from
      example: null
    template_id: self-consistency--sample-and-vote-harness
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
  - reasoning
  - multi-call
  - voting
  - baseline
  status: corpus-present
  aliases:
  - CoT-SC
  secondary_sources: []
  corpus_file: Self-Consistency.pdf
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: universal-self-consistency
  name: Universal Self-Consistency (USC)
  category: reasoning-elicitation
  subcategory: multi-path-reasoning
  executive_summary: Extend Self-Consistency to free-form, open-ended generation by having an LLM itself
    select the most consistent answer among sampled candidates, instead of requiring exact-match answer
    extraction to vote.
  description: 'Plain Self-Consistency''s majority-vote aggregation only works when a final answer can
    be cleanly extracted and exactly compared across samples (e.g. a numeric answer), which excludes free-form
    outputs like code, summaries, and open-ended question answering. USC removes that constraint: rather
    than extracting and voting, it shows all sampled candidates to an LLM judge and asks it to select
    or synthesize the most consistent one. Matches standard Self-Consistency''s performance on math reasoning
    (where exact-match voting is applicable) while also working on open-ended tasks where the original
    method simply cannot be applied at all.'
  verification_status: judge-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Open-ended or free-form generation tasks (code generation, summarization, open QA) where sampled outputs
    can't be exactly compared for a majority vote.
  - As a drop-in generalization of Self-Consistency when task type is mixed or unknown in advance.
  when_not_to_use:
  - Tasks with a cleanly extractable, exactly-comparable final answer — plain Self-Consistency's cheaper
    exact-match voting is sufficient and doesn't need an extra judge call.
  known_pitfalls:
  - Selection quality depends on the judge LLM's ability to recognize genuine consistency versus superficial
    similarity across free-form candidates — this is a judge-checkable property, not a verifier-checkable
    one like exact-match voting.
  related_techniques:
  - self-consistency
  - multiagent-debate
  primary_source:
    authors: Chen, Aksitov, Alon, Ren, Xiao, Yin, Prakash, Sutton, Wang, Zhou
    year: 2023
    title: Universal Self-Consistency for Large Language Model Generation
    venue: arXiv preprint
    arxiv_id: '2311.17311'
    url: https://arxiv.org/abs/2311.17311
  usage_templates:
  - template_name: Sample-and-judge-select for free-form outputs
    template: |-
      # Sample N={{num_samples}} candidates at temperature={{temperature}}
      {{generation_prompt}}

      # Select via LLM judge (single call, all candidates shown together)
      Here are {{num_samples}} candidate responses to the same task:
      {{all_candidates_numbered}}
      Select the response that is most consistent with the majority of the other candidates in content and approach, or synthesize a response that best represents their consensus. Explain your choice briefly, then give the final selected/synthesized response.
    variables:
    - name: num_samples
      description: How many candidates to sample
      example: '5'
    - name: temperature
      description: Sampling temperature for diversity
      example: '0.7'
    - name: generation_prompt
      description: The underlying generation prompt being sampled from
      example: null
    - name: all_candidates_numbered
      description: All sampled candidates, numbered, shown together to the judge
      example: null
    template_id: universal-self-consistency--sample-and-judge-select-for-free-form-outputs
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
  - reasoning
  - multi-call
  - voting
  - free-form
  - judge-based
  status: verified-external
  aliases:
  - USC
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: skeleton-of-thought
  name: Skeleton-of-Thought (SoT)
  category: reasoning-elicitation
  subcategory: parallel-reasoning
  executive_summary: Generate a short answer skeleton first, then expand every point in that skeleton
    in parallel, cutting end-to-end latency substantially.
  description: 'Stage one asks the model for a numbered skeleton of the answer (a few words per point,
    not full prose). Stage two expands each skeleton point independently and in parallel — via batched
    decoding or concurrent API calls — then concatenates the results. This targets latency rather than
    accuracy: reported up to 2.39x speed-up across 11 LLMs, with quality gains on some question categories
    and losses on others, so it is not a uniform win.'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - The answer naturally decomposes into a handful of largely independent points (lists, comparisons,
    multi-part explanations).
  - Latency matters more than squeezing out the last few points of quality.
  when_not_to_use:
  - The answer requires later points to depend on earlier ones (sequential reasoning) — parallel expansion
    breaks that dependency.
  - Single-call latency is already acceptable for the use case.
  known_pitfalls:
  - Quality can regress on question types needing tight cross-point coherence, since points are expanded
    without seeing each other's expansions.
  related_techniques:
  - self-consistency
  - graph-of-thoughts
  primary_source:
    authors: Ning, Lin, Zhou, Yang, Wang
    year: 2023
    title: 'Skeleton-of-Thought: Large Language Models Can Do Parallel Decoding'
    venue: ICLR 2024
    arxiv_id: '2307.15337'
    url: https://arxiv.org/abs/2307.15337
  usage_templates:
  - template_name: Two-stage skeleton-then-expand
    template: |-
      # Stage 1 — skeleton
      You're asked: {{question}}
      Provide a short skeleton of the answer: a numbered list of 3-10 points, each 3-5 words, covering the distinct parts of a full answer. Do not elaborate.

      # Stage 2 — parallel expansion (one call per point, run concurrently)
      You're answering: {{question}}
      The full answer skeleton is: {{full_skeleton}}
      Write only point {{point_index}}: "{{point_text}}" in 1-3 sentences, consistent in tone and detail with the other points but without repeating them.
    variables:
    - name: question
      description: The original question
      example: null
    - name: full_skeleton
      description: The complete skeleton from stage 1, given as context so each expansion stays consistent
      example: null
    - name: point_index
      description: Which numbered point this call expands
      example: '3'
    - name: point_text
      description: The short skeleton text for this point
      example: null
    template_id: skeleton-of-thought--two-stage-skeleton-then-expand
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - reasoning
  - parallel
  - latency
  - multi-call
  status: verified-external
  aliases:
  - SoT
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: apar-auto-parallel-decoding
  name: 'APAR: Auto-Parallel Auto-Regressive Decoding'
  category: reasoning-elicitation
  subcategory: parallel-reasoning
  executive_summary: Instruct-tune the model itself to recognize parallelizable structure in its own output
    and spawn multiple generation threads directly, instead of relying on an external skeleton-then-expand
    prompting template.
  description: 'A direct successor to Skeleton-of-Thought''s goal (reduce latency by generating independent
    parts of an answer in parallel), but moves the mechanism from the prompt into the model: instruct-tuning
    on data containing hierarchical/parallelizable structures teaches the model to autonomously plan its
    own generation and emit control tokens that spawn parallel generation threads, rather than requiring
    a separate skeleton-generation prompting stage. Reports up to 2x speed-up alone, and up to 4x when
    combined with speculative decoding. Unlike Skeleton-of-Thought, this is a training-time technique,
    not something achievable through prompting an off-the-shelf model — included here as the training-time
    complement so the parallel-decoding lineage in this catalog is complete.'
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - You control model fine-tuning and want parallel-generation speed-ups without a separate skeleton-prompting
    stage or the coordination overhead of managing parallel API calls yourself.
  when_not_to_use:
  - Working with a fixed, already-trained model with no fine-tuning access — use Skeleton-of-Thought's
    prompting-only approach instead.
  known_pitfalls:
  - Requires instruct-tuning infrastructure and training data with hierarchical/parallelizable structure;
    not a pure prompting-layer technique, so it doesn't transfer to models you can't fine-tune.
  related_techniques:
  - skeleton-of-thought
  - self-consistency
  primary_source:
    authors: Liu, Zeng, Wang, Zhang, Tang, Dong
    year: 2024
    title: 'APAR: LLMs Can Do Auto-Parallel Auto-Regressive Decoding'
    venue: arXiv preprint
    arxiv_id: '2401.06761'
    url: https://arxiv.org/abs/2401.06761
  usage_templates:
  - template_name: Instruct-tuning data format for parallel-structure planning
    template: |-
      # Training example format for instruct-tuning
      Instruction: {{instruction}}
      Response (annotated with parallelization control tokens where the model identifies independent sub-branches):
      {{main_response_prefix}}
      [FORK] {{parallel_branch_1}} [FORK] {{parallel_branch_2}} [JOIN]
      {{main_response_suffix}}

      # At inference, the fine-tuned model emits [FORK]/[JOIN] tokens itself, and the serving system spawns/merges generation threads accordingly — no separate skeleton-generation prompt call is needed.
    variables:
    - name: instruction
      description: The training instruction
      example: null
    - name: main_response_prefix
      description: Sequential content before the parallelizable section
      example: null
    - name: parallel_branch_1
      description: One independently-generatable branch
      example: null
    - name: parallel_branch_2
      description: Another independently-generatable branch
      example: null
    - name: main_response_suffix
      description: Sequential content after the parallelizable section rejoins
      example: null
    template_id: apar-auto-parallel-decoding--instruct-tuning-data-format-for-parallel-structure-planning
    determinism: training-time-not-applicable
    reproducibility_note: This template describes a training-time process (fine-tuning or policy training),
      not a single reproducible inference call; reproducibility depends on the training pipeline and data,
      not on prompt text alone.
  tags:
  - reasoning
  - parallel
  - latency
  - training-time
  status: verified-external
  aliases:
  - APAR
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: tree-of-thoughts
  name: Tree of Thoughts (ToT)
  category: reasoning-elicitation
  subcategory: multi-path-reasoning
  executive_summary: Search over a tree of intermediate reasoning steps, using the model itself to self-evaluate
    branches and backtrack, instead of committing to one linear chain.
  description: 'Generalizes chain-of-thought to a tree: at each step, the model proposes several possible
    next ''thoughts'', a self-evaluation prompt scores or votes on them, and a search strategy (BFS or
    DFS) decides which branches to expand or prune, with the ability to backtrack from dead ends. On tasks
    with a large combinatorial search space and a clear win/loss signal (e.g. Game of 24), this substantially
    outperforms single-chain CoT.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - The task has a genuine branching search space where wrong early choices need to be abandoned, not
    just retried.
  - A cheap self-evaluation signal exists for scoring partial solutions.
  when_not_to_use:
  - The task is essentially linear (no meaningful branch-and-backtrack structure) — the search overhead
    buys nothing over CoT or Self-Consistency.
  - Call budget is tightly capped, since tree search cost is unbounded/adaptive rather than fixed.
  known_pitfalls:
  - Cost is not fixed in advance — it depends on how much of the tree gets explored, which complicates
    budget planning compared to fixed-k Self-Consistency.
  related_techniques:
  - self-consistency
  - graph-of-thoughts
  - skeleton-of-thought
  primary_source:
    authors: Yao, Yu, Zhao, Shafran, Griffiths, Cao, Narasimhan
    year: 2023
    title: 'Tree of Thoughts: Deliberate Problem Solving with Large Language Models'
    venue: NeurIPS 2023
    arxiv_id: '2305.10601'
    url: https://arxiv.org/abs/2305.10601
  usage_templates:
  - template_name: Propose-evaluate-select loop
    template: |-
      # Propose
      Given the current partial solution: {{partial_state}}
      Propose {{branch_count}} distinct next steps toward solving: {{goal}}

      # Evaluate (run once per proposed branch)
      Partial solution so far: {{candidate_branch}}
      On a scale of sure/maybe/impossible, how likely is this partial solution to lead to a correct final answer for: {{goal}}? Answer with one word and one sentence why.

      # Select
      Keep the top {{beam_width}} branches by evaluation and repeat Propose on each until a branch reaches a complete, verified solution or the depth limit {{max_depth}} is reached.
    variables:
    - name: goal
