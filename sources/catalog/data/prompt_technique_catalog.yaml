  - Short contexts where compression is unnecessary.
  - When the question is unknown at compression time.
  - When compression latency is unacceptable.
  known_pitfalls:
  - Question-aware scoring adds computational overhead.
  - Coarse compression may discard documents with subtle relevance.
  - Fine compression may break semantic coherence of retained text.
  related_techniques:
  - llmlingua-prompt-compression
  - selective-context
  - recomp
  - retrieval-augmented-generation
  primary_source:
    authors: Jiang, Wu, Luo, Li, Lin, Yang, Qiu
    year: 2023
    title: 'LongLLMLingua: Accelerating and Enhancing LLMs in Long Context Scenarios via Prompt Compression'
    venue: arXiv
