- id: selfcheckgpt
  name: SelfCheckGPT
  category: self-verification-refinement
  subcategory: consistency-checking
  executive_summary: Samples multiple responses to the same prompt and checks consistency across them
    to detect hallucination without requiring an external fact-checker or knowledge base.
  description: SelfCheckGPT generates N answers to the same question at temperature > 0. It then measures
    consistency across the answers (via n-gram overlap, BERTScore, or LLM-as-judge). High consistency
    suggests the answer is grounded; contradictions suggest hallucination.
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - You need hallucination detection but lack access to an external knowledge base.
  - Using black-box APIs where hidden-state methods are impossible.
  - High-stakes generation where a consistency check is better than no check.
  when_not_to_use:
  - When an external fact-checker or retrieval system is available.
  - When the model consistently hallucinates the same incorrect fact across samples.
  - Cost-sensitive applications where N samples are prohibitive.
  known_pitfalls:
  - Consistent hallucinations across samples will not be detected.
  - Requires temperature > 0; some APIs charge per token, making N samples expensive.
  - Consistency metrics may miss semantic contradictions.
  related_techniques:
  - chain-of-verification
  - self-refine
  primary_source:
