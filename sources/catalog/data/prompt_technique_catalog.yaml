  subcategory: logical-consistency-optimization
  executive_summary: Recursively generate a tree of both supporting and opposing explanations for a candidate
    answer, then use a MAX-SAT-style optimization over the tree's logical relations to select the most
    globally consistent answer.
  description: Named for the Socratic 'maieutic' (midwife) method of drawing out knowledge through recursive
    questioning. For a candidate answer, the model generates an explanation, then a counter-explanation
    for why the candidate might be false, recursing to a fixed depth to build a tree of statements with
    logical relations (entailment/contradiction) between them. A symbolic MAX-SAT-style solver then finds
    the most consistent assignment of true/false across the whole tree, which determines the final answer
    — a fundamentally different verification mechanism from Chain-of-Verification's independent Q&A or
    Backward Self-Verification's condition-masking, using formal logical consistency across a generated
    explanation tree instead.
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Commonsense or belief-style reasoning tasks with a true/false structure, where logical consistency
    across supporting and opposing explanations is a meaningful signal.
  when_not_to_use:
  - Open-ended generation with no natural true/false candidate structure to build an explanation tree
    around.
  known_pitfalls:
  - Cost grows with tree depth and branching factor; the explanation tree must actually be generated and
    integrated with a symbolic solver, adding real implementation complexity relative to a plain voting-based
    method.
  related_techniques:
  - chain-of-verification
  - backward-self-verification
  - self-consistency
  primary_source:
    authors: Jung, Qin, Welleck, Brahman, Bhagavatula, Le Bras, Choi
    year: 2022
    title: 'Maieutic Prompting: Logically Consistent Reasoning with Recursive Explanations'
    venue: EMNLP 2022
    arxiv_id: '2205.11822'
    url: https://arxiv.org/abs/2205.11822
  usage_templates:
  - template_name: Recursive explanation tree with consistency optimization
    template: |-
      # Generate explanation tree (recurse to depth {{max_depth}})
      Candidate answer: {{candidate_statement}}
      Explain why this is true: {{explanation_for}}
      Explain why this might be false instead: {{explanation_against}}
      (recurse: generate explanation_for/against for each new explanation, to {{max_depth}})

      # Extract logical relations between tree nodes
      Does {{node_a}} entail or contradict {{node_b}}? {{logical_relation}}

      # Solve
      Find the truth-value assignment across all tree nodes that maximizes logical consistency with the extracted relations (MAX-SAT). The assignment for {{candidate_statement}} is the final answer.
    variables:
    - name: candidate_statement
      description: The candidate true/false statement being evaluated
      example: null
    - name: max_depth
      description: Recursion depth for the explanation tree
      example: '2'
    - name: explanation_for
      description: Generated explanation supporting the parent statement
      example: null
    - name: explanation_against
      description: Generated explanation opposing the parent statement
      example: null
    - name: node_a
      description: One tree node being compared for logical relation
      example: null
    - name: node_b
      description: Another tree node being compared
      example: null
    - name: logical_relation
      description: Entailment, contradiction, or neutral relation between the two nodes
      example: null
    template_id: maieutic-prompting--recursive-explanation-tree-with-consistency-optimization
    determinism: stochastic-by-design
    reproducibility_note: This template intentionally samples multiple times or explores adaptively; outputs
      vary run to run by design (explicit temperature>0 sampling, or multi-branch search whose path depends
      on intermediate stochastic choices).
  tags:
  - verification
  - logical-consistency
  - commonsense
  - multi-call
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: verified-against-abstract
    pitfalls: unverified
- id: constitutional-ai
  name: Constitutional AI (CAI)
  category: self-verification-refinement
  subcategory: alignment
  executive_summary: Have the model critique and revise its own outputs against a written 'constitution'
    of principles, then train on the revisions — self-critique against explicit rules rather than human
    preference labels.
  description: 'A two-stage process: a supervised stage where the model critiques and revises its own
    responses according to a list of natural-language principles, generating a self-improved training
    set; and a reinforcement-learning stage (RLAIF) where AI-generated preference judgments between response
    pairs, made according to the same constitution, replace human preference labels. The self-verification-refinement
    mechanism (critique against written principles, then revise) is the same conceptual move SALMON''s
    instructable reward model makes at the reward-signal level — CAI is the earlier, foundational version
    of using an explicit constitution to steer self-critique.'
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - Building a self-alignment or self-critique pipeline where a written set of principles already exists
    (or can be authored) and should govern the critique/revision process explicitly, rather than being
    left implicit.
  when_not_to_use:
  - Inference-time-only prompting with no training loop — the RLAIF stage in particular requires a training
    pipeline, not just a prompt template.
  known_pitfalls:
  - Output quality is bounded by how well-specified the constitution is; vague or conflicting principles
    produce vague or inconsistent critique-and-revise behavior.
  related_techniques:
  - salmon
  - self-refine
  - chain-of-verification
  primary_source:
    authors: Bai, Kadavath, Kundu, Askell, Kernion, Jones, Chen, Goldie, Mirhoseini, McKinnon, et al.
    year: 2022
    title: 'Constitutional AI: Harmlessness from AI Feedback'
    venue: arXiv preprint (Anthropic)
    arxiv_id: '2212.08073'
    url: https://arxiv.org/abs/2212.08073
  usage_templates:
  - template_name: Critique-and-revise against a written constitution
    template: |-
      Constitution (principles to critique against): {{constitution_principles}}

      # Critique
      Response: {{draft_response}}
      Identify ways this response violates any of the principles above.

      # Revise
      Response: {{draft_response}}
      Critique: {{critique}}
      Rewrite the response to address the critique while remaining helpful.

      # (Training-time only) AI preference labeling
      Given two responses {{response_a}} and {{response_b}} to the same prompt, which better satisfies the constitution above? Use this judgment as a preference label instead of a human-labeled one.
    variables:
    - name: constitution_principles
      description: The explicit written set of principles guiding critique
      example: null
    - name: draft_response
      description: The response being critiqued and revised
      example: null
    - name: critique
      description: Output of the critique step
      example: null
    - name: response_a
      description: First candidate response for AI preference labeling
      example: null
    - name: response_b
      description: Second candidate response for AI preference labeling
      example: null
    template_id: constitutional-ai--critique-and-revise-against-a-written-constitution
    determinism: training-time-not-applicable
    reproducibility_note: This template describes a training-time process (fine-tuning or policy training),
      not a single reproducible inference call; reproducibility depends on the training pipeline and data,
      not on prompt text alone.
  tags:
  - alignment
  - training-time
  - self-critique
  - safety
  status: verified-external
  aliases:
  - CAI
  secondary_sources: []
