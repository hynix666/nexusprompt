- id: corrective-rag
  name: Corrective RAG (CRAG)
  category: retrieval-augmentation
  subcategory: retrieval-evaluation
  executive_summary: Adds a retrieval evaluator (Correct/Incorrect/Ambiguous) that triggers web-search
    fallback or decomposition when retrieved documents are poor. Directly addresses RAG confabulation
    on empty or irrelevant retrieval.
  description: CRAG evaluates each retrieved document against the query, labeling it Correct, Incorrect,
    or Ambiguous. If any document is Incorrect or all are Ambiguous, the system triggers a fallback. Only
    Correct documents are used for generation.
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Production RAG systems where retrieval quality is variable.
  - Domains where stale or incorrect documents may be retrieved.
  - When a web-search fallback is available as a safety net.
  when_not_to_use:
  - When retrieval quality is consistently high and evaluation adds overhead.
  - When no fallback source is available.
  - Latency-critical applications where the evaluator adds unacceptable delay.
  known_pitfalls:
  - The evaluator itself can be wrong, leading to false positives or false negatives.
  - Web-search fallback may introduce new hallucination sources.
  - All-Ambiguous routing can be overly conservative.
  related_techniques:
  - self-rag
  - retrieval-augmented-generation
  primary_source:
    authors: Yan, Gu, Zhu, Ling
    year: 2024
    title: Corrective Retrieval Augmented Generation
    venue: arXiv
    arxiv_id: '2401.15884'
    url: https://arxiv.org/abs/2401.15884
  usage_templates:
  - template_name: Retrieval evaluator with fallback
    template: |-
      Query: {{query}}
      Retrieved Documents: {{documents}}

      Evaluate each document: [Correct] / [Incorrect] / [Ambiguous]
      If any document is Incorrect or all are Ambiguous, trigger web-search fallback.
      If Correct documents exist, answer from them.
    variables:
    - name: query
      description: The user query.
      example: What is the latest version of Python?
    - name: documents
      description: Retrieved documents to evaluate.
      example: '[Doc1: Python 3.9 released Oct 2020...], [Doc2: Python 3.11 features...]'
    template_id: corrective-rag--evaluator-fallback
