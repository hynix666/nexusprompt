  - adversarial
  - red-teaming
  - black-box
  - agentic-loop
  status: verified-external
  aliases:
  - PAIR
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: many-shot-jailbreaking
  name: Many-Shot Jailbreaking (MSJ)
  category: prompt-injection-defense
  subcategory: threat-modeling
  executive_summary: Stuff hundreds of fake 'harmful Q, harmful A' turns into a long context before the
    real question — the model completes the pattern instead of following safety training, success scaling
    as a power law in shot count.
  description: 'Exploits large context windows directly: rather than any clever wording, the attack simply
    provides many demonstrations (tens to hundreds) of the model answering harmful requests, then asks
    a final real harmful question. In-context learning from the fabricated pattern outweighs the model''s
    safety training as shot count grows, with attack success following a predictable power-law scaling.
    Effective across models from multiple developers, robust to changes in the specific harmful topic
    and format. The most directly relevant addition to this catalog''s `example-selection-formatting`
    category as a threat model: it''s a many-shot in-context-learning attack, the adversarial mirror image
    of techniques like Active Prompting or nearest-neighbor exemplar selection.'
  verification_status: unverifiable-by-text
  cost_profile: single-call
  when_to_use:
  - Threat-modeling any system with a long context window and any path for a user or ingested document
    to supply many turns of conversation history or few-shot content.
  when_not_to_use:
  - N/A — threat-model background, not an applied generation technique.
  known_pitfalls:
  - Reported mitigations (retraining to recognize the many-shot pattern) raise the number of shots required
    rather than eliminating the vulnerability outright — attackers can typically compensate by adding
    more shots, since the attack is scalable by construction as context windows grow.
  related_techniques:
