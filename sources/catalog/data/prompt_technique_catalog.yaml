    description: verified-against-abstract
    pitfalls: unverified
- id: critic-tool-interactive-critiquing
  name: CRITIC (Tool-Interactive Critiquing)
  category: self-verification-refinement
  subcategory: tool-grounded-verification
  executive_summary: Have the model critique its own draft using external tools (search, code, calculators)
    to check specific claims, then revise based on those findings — grounding self-correction in evidence,
    not self-assessment.
  description: 'Directly addresses a limitation Self-Refine and plain self-critique share: a model critiquing
    its own output using only its own judgment can''t catch errors it doesn''t already know are errors
    — the critique inherits the same knowledge gaps as the original generation. CRITIC breaks this by
    having the model identify specific, tool-checkable claims in its draft (a fact needing search verification,
    a calculation needing a calculator, code needing execution), invoke the appropriate external tool
    for each, and revise the output based on what the tools actually returned — closer to Chain-of-Verification''s
    independent-checking spirit but grounded in real external tools rather than the model''s own re-answering.
    Reported improving performance on free-form QA, mathematical program synthesis, and toxicity reduction
    relative to prior self-correction methods that verify without external tools.'
  verification_status: verifier-checkable
  cost_profile: multi-call-adaptive
  when_to_use:
  - Tasks where specific claims in a draft output are checkable via an available tool (search for facts,
    interpreter for code/math) and grounding self-correction in real evidence matters more than the added
    tool-call cost.
  when_not_to_use:
  - No relevant tools are available to check the draft's claims — falls back to being no better than plain
    Self-Refine.
  - Purely subjective or creative outputs with no tool-checkable factual claims.
  known_pitfalls:
  - Only as good as the model's ability to identify which specific claims are worth tool-checking in the
    first place — an error the model doesn't think to flag for verification won't get caught.
  related_techniques:
  - self-refine
  - chain-of-verification
  - react
  primary_source:
    authors: Gou, Shao, Gong, Shen, Yang, Duan, Chen
    year: 2024
    title: 'CRITIC: Large Language Models Can Self-Correct with Tool-Interactive Critiquing'
    venue: ICLR 2024
    arxiv_id: '2305.11738'
    url: https://arxiv.org/abs/2305.11738
  usage_templates:
  - template_name: Draft, tool-check specific claims, revise
    template: |-
      # Draft
      {{task_prompt}}

      # Identify tool-checkable claims
      Draft: {{draft_output}}
      Identify specific claims in this draft that could be checked with a tool (search, calculator, code interpreter): {{checkable_claims}}

      # Tool-check each claim
      Claim: {{one_claim}}
      Tool: {{tool_name}}
      Tool result: {{tool_result}}

      # Revise
      Draft: {{draft_output}}
      Tool-verified findings: {{all_tool_results}}
      Produce a revised output correcting any claims the tools contradicted.
    variables:
    - name: task_prompt
      description: The original task
      example: null
    - name: draft_output
      description: The first-pass draft being critiqued
      example: null
    - name: checkable_claims
      description: Specific claims identified as tool-checkable
      example: null
    - name: one_claim
      description: One specific claim being checked
      example: null
    - name: tool_name
      description: The tool used to check this claim
      example: null
    - name: tool_result
      description: What the tool returned
      example: null
    - name: all_tool_results
      description: Collected results from all tool checks
      example: null
    template_id: critic-tool-interactive-critiquing--draft-tool-check-specific-claims-revise
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - verification
  - tool-use
  - grounding
  - multi-call
  status: verified-external
  aliases:
  - CRITIC
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: self-calibration
  name: Self-Calibration
  category: self-verification-refinement
  subcategory: confidence-estimation
  executive_summary: Ask the model to state a calibrated confidence estimate for its own answer, and find
    that models — especially larger ones — can produce confidence estimates that meaningfully track actual
    correctness.
  description: 'Distinct from other verification techniques in this catalog: rather than checking a claim''s
    content against evidence or logic, Self-Calibration asks the model to introspect on its own likely
    correctness and produce a usable confidence signal. Demonstrated that models can be trained or prompted
    to predict ''P(True)'' — the probability their stated answer is correct — with that self-reported
    probability empirically correlating with actual accuracy, and that performance improves further when
    the model can consider multiple of its own sampled answers before calibrating. Foundational to any
    technique in this catalog that needs a usable confidence score to act on (e.g. deciding whether to
    trust an answer, defer to a human, or trigger additional verification).'
  verification_status: verifier-checkable
  cost_profile: multi-call-fixed
  when_to_use:
  - Deployments needing a usable confidence signal to decide whether to trust, flag for review, or trigger
    further verification on a given answer.
  - As a cheap gate before spending more compute on heavier verification techniques (Chain-of-Verification,
    CRITIC) — only escalate low-confidence answers.
  when_not_to_use:
  - Contexts where a stated confidence number would be over-trusted by an end user beyond what the calibration
    quality actually supports — verify calibration quality empirically for the specific model/task before
    relying on it.
  known_pitfalls:
  - Calibration quality varies by model scale and task; a confidence estimate is only as trustworthy as
    the model's demonstrated (not assumed) calibration on that specific task type.
  related_techniques:
  - chain-of-verification
  - self-consistency
  - universal-self-consistency
  primary_source:
    authors: Kadavath, Conerly, Askell, Henighan, Drain, Perez, Schiefer, Dodds, DasSarma, Tran-Johnson,
      et al.
    year: 2022
    title: Language Models (Mostly) Know What They Know
    venue: arXiv preprint (Anthropic)
    arxiv_id: '2207.05221'
    url: https://arxiv.org/abs/2207.05221
  usage_templates:
  - template_name: Self-reported P(True) confidence estimate
    template: |-
      Question: {{question}}
      Proposed answer: {{proposed_answer}}

      Is the proposed answer:
      (A) True
      (B) False

      Consider other possible answers you might have given before responding. Give the probability that the proposed answer is correct as a number between 0 and 1: {{p_true_estimate}}
    variables:
    - name: question
      description: The original question
      example: null
    - name: proposed_answer
      description: The answer whose correctness is being self-assessed
      example: null
    - name: p_true_estimate
      description: The model's self-reported probability the answer is correct
      example: null
    template_id: self-calibration--self-reported-p-true-confidence-estimate
    determinism: deterministic-at-temperature-zero
    reproducibility_note: A single LLM call (or a fixed sequence of them) with no external system dependency;
      running this template again at temperature 0 against the same model version should reproduce the
      same output.
  tags:
  - verification
  - confidence-estimation
  - calibration
  - multi-call
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: react
  name: ReAct (Reason + Act)
  category: agentic-tool-use
  subcategory: reasoning-action-interleaving
  executive_summary: Interleave reasoning traces ('thoughts') with actions against an external environment
    or tool, so each action is informed by explicit reasoning and each new observation updates the reasoning.
  description: At each step the model produces a Thought (reasoning about what to do next), an Action
    (a tool call — search, lookup, calculator, etc.), and receives an Observation (the tool's result),
    which becomes context for the next Thought. This grounds reasoning in real intermediate feedback rather
    than the model's own unchecked assumptions, and is the paper most later agent-loop frameworks cite
    as their origin.
  verification_status: verifier-checkable
  cost_profile: agentic-loop
  when_to_use:
  - The task requires interacting with an external tool or environment (search, code execution, APIs)
    whose results should inform subsequent reasoning.
  when_not_to_use:
  - No external tools are available or needed — plain CoT is simpler and cheaper for closed-book reasoning.
  known_pitfalls:
  - Can loop unproductively (repeated similar actions) without an explicit step or turn limit.
  related_techniques:
  - program-of-thoughts
  - reflexion
  - plan-and-solve-prompting
  primary_source:
    authors: Yao, Zhao, Yu, Du, Shafran, Narasimhan, Cao
    year: 2023
    title: 'ReAct: Synergizing Reasoning and Acting in Language Models'
    venue: ICLR 2023
    arxiv_id: '2210.03629'
    url: https://arxiv.org/abs/2210.03629
  usage_templates:
  - template_name: Thought-Action-Observation loop
    template: |-
      Answer the question using the available tools: {{tool_list}}
      Question: {{question}}

      Thought: {{reasoning_about_next_step}}
      Action: {{tool_name}}[{{tool_input}}]
      Observation: {{tool_result}}
      ... (repeat Thought/Action/Observation until ready) ...
      Thought: I now know the final answer.
      Final Answer: {{final_answer}}
    variables:
    - name: tool_list
      description: Names and descriptions of available tools
      example: null
    - name: question
      description: The task/question to resolve
      example: null
    - name: tool_name
      description: Which tool is being invoked this step
      example: search
    - name: tool_input
      description: Input passed to the tool
      example: null
    - name: tool_result
      description: What the tool returned
      example: null
    - name: reasoning_about_next_step
      description: The model's stated reasoning for what to do next
      example: null
    - name: final_answer
      description: The final answer once enough Thought/Action/Observation steps have run
      example: null
    template_id: react--thought-action-observation-loop
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - agentic
  - tool-use
  - multi-call
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: toolformer-self-supervised-tool-use
  name: Toolformer (Self-Supervised Tool-Use Training)
  category: agentic-tool-use
  subcategory: tool-use-training
  executive_summary: Train the model itself, in a self-supervised way from just a handful of demonstrations
    per API, to decide which tool to call, when to call it, what arguments to pass, and how to weave the
    result back into generation.
  description: 'Distinct from ReAct: rather than a prompting pattern applied to an off-the-shelf model,
    Toolformer trains the model to autonomously insert API calls (calculator, Q&A system, search engines,
    translation, calendar) into its own generation wherever doing so would have reduced the model''s loss
    on the next tokens, using self-generated candidate API calls filtered by whether they actually help.
    The result is a model that spontaneously decides for itself when a tool call would help, without a
    hand-written ReAct-style Thought/Action/Observation scaffold in the prompt. Reports substantially
    improved zero-shot performance across downstream tasks, often competitive with much larger models,
    without sacrificing core language modeling ability.'
  verification_status: unverifiable-by-text
  cost_profile: training-time
  when_to_use:
  - You control fine-tuning and want tool-use behavior built into the model's own generation policy, rather
    than depending on the prompt to scaffold every tool interaction explicitly.
  when_not_to_use:
  - Working with a fixed, already-trained model with no fine-tuning access — use ReAct's pure-prompting
    approach instead.
  known_pitfalls:
  - Requires self-supervised training infrastructure and the specific set of tools the model is trained
    on; doesn't generalize to a novel tool at inference time the way a well-designed ReAct prompt can,
    since tool-selection behavior is baked in at training time.
  related_techniques:
  - react
  - program-of-thoughts
  primary_source:
    authors: Schick, Dwivedi-Yu, Dessì, Raileanu, Lomeli, Zettlemoyer, Cancedda, Scialom
    year: 2023
    title: 'Toolformer: Language Models Can Teach Themselves to Use Tools'
    venue: NeurIPS 2023
    arxiv_id: '2302.04761'
    url: https://arxiv.org/abs/2302.04761
  usage_templates:
  - template_name: Self-supervised API-call training data format
    template: |-
      # Candidate generation (self-sampled by the model during training)
      Text so far: {{text_prefix}}
      Sample candidate API calls the model itself thinks might help: {{candidate_api_call}}

      # Filter by usefulness
      Compare next-token loss on {{ground_truth_continuation}} with vs. without the API call result {{api_call_result}} inserted. Keep the candidate only if including the result reduces loss by more than {{loss_reduction_threshold}}.

      # Fine-tune on the filtered, self-annotated examples so the model learns to insert calls like {{candidate_api_call}} autonomously at inference time.
    variables:
    - name: text_prefix
      description: The text preceding a candidate insertion point
      example: null
    - name: candidate_api_call
      description: A self-generated candidate API call (tool name + arguments)
      example: '[Calculator(27 * 4)]'
    - name: ground_truth_continuation
      description: The actual next tokens used to score whether the call helped
      example: null
    - name: api_call_result
      description: What the tool returned for the candidate call
      example: null
    - name: loss_reduction_threshold
      description: Minimum loss reduction required to keep a candidate as a training example
      example: '0.05'
    template_id: toolformer-self-supervised-tool-use--self-supervised-api-call-training-data-format
    determinism: training-time-not-applicable
    reproducibility_note: This template describes a training-time process (fine-tuning or policy training),
      not a single reproducible inference call; reproducibility depends on the training pipeline and data,
      not on prompt text alone.
  tags:
  - agentic
  - tool-use
  - training-time
  - self-supervised
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: generative-agents-memory-architecture
  name: Generative Agents (Memory Stream + Reflection + Planning)
  category: agentic-tool-use
  subcategory: persistent-agent-architecture
  executive_summary: Give an agent a long-term memory stream, periodically synthesize it into reflections,
    and retrieve relevant memories dynamically to inform planning — an architecture for believable, persistent
    agent behavior.
  description: 'Distinct from Reflexion''s episodic retry-memory: this is a standing architecture for
    agents that operate continuously over long horizons, not just across retries at one task. Three components
    work together — a memory stream recording every observation in natural language, a reflection process
    that periodically synthesizes recent memories into higher-level insights, and a retrieval function
    that scores stored memories by recency, importance, and relevance to pull the right context into each
    planning decision. Demonstrated in a sandbox environment where 25 agents exhibited emergent believable
    behaviors (planning a party, spreading information, forming relationships) purely from this memory/reflection/planning
    loop, without any of it being scripted.'
  verification_status: unverifiable-by-text
  cost_profile: agentic-loop
  when_to_use:
  - Building an agent that needs to operate coherently over a long horizon with many interactions, where
    relevant context from far in the past needs to resurface at the right moment (not just the most recent
    turns).
  when_not_to_use:
  - Short, single-session tasks where a standing memory architecture is pure overhead — Reflexion's lighter
    episodic memory or plain context suffices.
  known_pitfalls:
  - Memory retrieval quality (the recency/importance/relevance scoring function) is a single point of
    failure — poorly tuned retrieval surfaces the wrong memories at the wrong time, degrading planning
    quality without an obvious error signal.
  related_techniques:
  - reflexion
  - meta-prompting
  - react
  primary_source:
    authors: Park, O'Brien, Cai, Morris, Liang, Bernstein
    year: 2023
    title: 'Generative Agents: Interactive Simulacra of Human Behavior'
    venue: UIST 2023
    arxiv_id: '2304.03442'
    url: https://arxiv.org/abs/2304.03442
  usage_templates:
  - template_name: Memory stream / reflect / retrieve-and-plan loop
    template: |-
      # Record (per observation)
      Append to memory stream: {{timestamp}} — {{observation_text}}

      # Reflect (periodically, e.g. once memory importance sum exceeds a threshold)
      Recent memories: {{recent_memory_batch}}
      What are the {{num_reflections}} most salient high-level insights or questions these memories suggest? For each, cite the specific memories that support it.

      # Retrieve-and-plan (before each action)
      Current situation: {{current_context}}
      Retrieve the memories most relevant by recency, importance, and relevance to this situation from: {{full_memory_stream}}
      Retrieved memories: {{retrieved_memories}}
      Given these, what should {{agent_name}} do next?
    variables:
    - name: timestamp
      description: When this observation occurred
      example: null
    - name: observation_text
      description: A natural-language record of what happened
      example: null
    - name: recent_memory_batch
      description: Recent memories being synthesized into reflections
      example: null
    - name: num_reflections
      description: How many high-level reflections to generate
      example: '3'
    - name: current_context
      description: The agent's present situation, used to query memory
      example: null
    - name: full_memory_stream
      description: The complete accumulated memory store being queried
      example: null
    - name: retrieved_memories
      description: The subset of memories retrieved as most relevant
      example: null
    - name: agent_name
      description: Identifier for the agent whose next action is being planned
      example: null
    template_id: generative-agents-memory-architecture--memory-stream-reflect-retrieve-and-plan-loop
    determinism: requires-external-system
    reproducibility_note: This template depends on an external system (retrieval index, tool, solver,
      or interpreter) whose own behavior is outside the prompt's control; bit-for-bit reproducibility
      requires that system's state to also be fixed.
  tags:
  - agentic
  - memory
  - planning
  - persistent-architecture
  status: verified-external
  aliases: []
  secondary_sources: []
  corpus_file: null
  schema_version: 1.3.0
  source_audit:
    description: unverified
    pitfalls: unverified
- id: plan-and-solve-prompting
  name: Plan-and-Solve Prompting
  category: agentic-tool-use
  subcategory: planning
  executive_summary: Explicitly separate 'devise a plan' from 'carry out the plan' as two distinct prompted
    steps, rather than letting planning and execution blur together in one CoT pass.
  description: Stage one produces an explicit multi-step plan for solving the problem without yet solving
    any step. Stage two executes the plan step by step, referencing the plan text throughout. Zero-shot,
    requiring no exemplars, and specifically targets CoT failure modes caused by missing steps or calculation
    errors from conflating planning and execution.
  verification_status: verifier-checkable
  cost_profile: single-call
  when_to_use:
  - Multi-step problems where plain zero-shot CoT tends to skip steps or lose track of the overall structure.
  when_not_to_use:
