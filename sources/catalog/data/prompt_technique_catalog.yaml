  - Production RAG systems serving diverse user intents.
  when_not_to_use:
  - When all queries are uniformly complex.
  - When query complexity classification is unreliable.
  - When the routing overhead exceeds retrieval savings.
  known_pitfalls:
  - Query complexity classification errors route hard questions to simple pipelines (under-retrieval)
    or easy questions to expensive pipelines (waste).
  - Classifier training requires labeled query complexity data.
  - Routing adds latency before retrieval even begins.
