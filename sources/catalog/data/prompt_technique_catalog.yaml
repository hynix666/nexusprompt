- id: xml-tagging-schema-specs
  name: XML Tagging / Schema Specs
  category: template-pattern-scaffolding
  subcategory: structural-delimiters
  executive_summary: Explicit structural delimiters (XML tags, markdown fences, schema specs) to separate
    instructions, context, and output zones. Reduces parsing errors, improves model comprehension, and
    mitigates injection risk.
  description: XML tagging and schema specifications provide unambiguous boundaries between different
    semantic zones in a prompt. By wrapping instructions in <instructions>, context in <context>, and
    expected output in <output_format>, the model can better distinguish trusted instructions from untrusted
    user input.
  verification_status: unverifiable-by-text
  cost_profile: single-call
  when_to_use:
  - Any production prompt where instructions and user input coexist.
  - When parsing errors occur due to ambiguous boundaries.
  - As a defense-in-depth measure against prompt injection.
  when_not_to_use:
  - Simple conversational prompts with no structured sections.
  - When the model is known to struggle with XML formatting.
  - When token minimization is critical and tags add unacceptable overhead.
  known_pitfalls:
  - Malformed XML (unclosed tags) can confuse the model.
  - Over-nesting tags adds token overhead without proportional benefit.
  - Not all models handle XML equally well; test with your target model.
  related_techniques:
  - structured-output-json-mode
  primary_source:
    authors: Anthropic / Claude Best Practices
    year: 2025
    title: 'Prompt Engineering Best Practices: XML Tagging'
