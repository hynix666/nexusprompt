# Customizes the environment the GitHub Copilot coding agent boots into. Invoked by
# Copilot itself (or manually via workflow_dispatch) — never by push or pull_request,
# per GitHub's own copilot-setup-steps convention.
#
# Third-party actions are pinned to a commit SHA, matching verify.yml's policy: a
# floating tag is mutable, a SHA is not.
name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
