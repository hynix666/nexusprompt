# The mechanism that keeps README.md from going quietly false.
#
# Every command documented in the README runs here, in the order `verify` defines: boundaries
# and schemas first, then Core, then Application, adapters, the evaluation suites, and the
# differential oracle last.
#
# `npm run verify` is the whole check and it runs anywhere, which is deliberate. `check:corpus`
# is NOT part of it: that check re-hashes the 661-file research corpus under `PDF/`, which is
# gitignored and deliberately not distributed — 2 GB of third-party papers whose canonical home
# is arXiv. A fresh checkout has never had it, so folding it into `verify` would make the
# headline command fail for every adopter. It is a check on a local asset, and it has its own
# command.
#
# First executed 23 August 2026, against hynix666/nexusprompt, and green on the first run:
# `npm ci` plus the full `verify` on a clean Ubuntu checkout. That is what makes the guards
# real rather than local habit -- before it, every check depended on someone remembering to
# run them on one machine.
name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a COMMIT, with the version in the trailing comment.
      #
      # A `@v7` tag is mutable: whoever controls the repository can repoint it, and the next
      # build runs different code with the same reference and no diff anywhere. This workflow
      # runs `npm ci` and executes the whole test suite, so an action running here has the
      # repository, the lockfile, and any secret the job is ever given.
      #
      # That is a real concern rather than a hypothetical: `tj-actions/changed-files` was
      # compromised in March 2025 by repointing its tags at a malicious commit, and every
      # workflow referencing it by tag picked the change up automatically.
      #
      # A SHA does not update itself, which is the trade — read it as a dependency pin that
      # needs deliberate bumping, exactly like `package-lock.json`, and re-resolve the tag
      # when you bump it rather than trusting the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      # The differential oracle shells out to the frozen Python linter. Without Python the
      # oracle cannot run, and an oracle that silently skips is worse than none — ADR-0007.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify
